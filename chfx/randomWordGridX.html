<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Words Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --app-height: 100%;
            --tile-size: 200px; /* Fallback, overridden by JS */
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: var(--app-height);
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0C273C, black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Lato', sans-serif;
        }

        #grid-container {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr));
            grid-auto-rows: var(--tile-size);
            gap: 0;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            overflow: hidden;
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            cursor: pointer;
            overflow: hidden;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s linear, visibility 0.6s linear;
        }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-back {
            transform: rotateY(90deg);
        }

        .tile img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            height: auto;
            display: block;
            margin: auto;
        }

        .tile img[alt] {
            text-indent: -9999px;
        }

        .flipping {
            transform: rotateY(90deg);
            visibility: hidden;
        }

        .appearing {
            transform: rotateY(0deg);
            visibility: visible;
        }

        @keyframes flip-to-90 {
            0% { transform: rotateY(0deg); visibility: visible; }
            100% { transform: rotateY(90deg); visibility: hidden; }
        }

        @keyframes appear-from-90 {
            0% { transform: rotateY(90deg); visibility: hidden; }
            100% { transform: rotateY(0deg); visibility: visible; }
        }

        #contentFrame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background: transparent;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 2;
        }

        #sentenceImage {
            max-width: 90vw;
            max-height: 90vh;
            position: absolute;
            display: none;
            opacity: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease-in-out;
            z-index: 3;
        }

        .nav-buttons {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            bottom: 20px;
            padding: 8px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 4;
        }

        .nav-buttons img {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.3s ease;
            object-fit: contain;
        }

        .nav-buttons img:hover {
            transform: scale(1.1);
        }

        #guideButton {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .nav-buttons img {
                width: 36px;
                height: 36px;
            }

            #guideButton {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 480px) {
            .nav-buttons img {
                width: 32px;
                height: 32px;
            }

            #guideButton {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <div id="grid-container"></div>
    <iframe id="contentFrame"></iframe>
    <img id="sentenceImage" onclick="playSentenceAudio()"/>
    <div id="navigation" class="nav-buttons" style="display: none;">
        <img src="https://chineseffect.com/images/arrowLeft.png" id="backButton" alt="Back">
        <img src="https://chineseffect.com/images/guide.png" id="guideButton" alt="Guide">
        <img src="https://chineseffect.com/images/arrowRight.png" id="nextButton" alt="Next">
    </div>

    <script>
        let historyStack = [];
        let currentIndex = -1;
        let wordsList = [];
        let relatedSentences = [];
        let step = 0;
        let selectedWord = "";
        let currentSentenceName = "";
        let displayMode = "";
        let sentenceForAnimation = "";
        let stars = [];
        let decomposedSentencesList = [];
        let gridTiles = [];
        let activeWordIndex = -1;
        let imageCache = {};
        let usedWordIndexes = new Set();
        let resizeTimeout = null;

        const FALLBACK_IMAGE = 'https://chineseffect.com/images/favicon.png';
        const SECONDARY_FALLBACK_IMAGE = 'https://via.placeholder.com/100/000000/FFFFFF?text=Fallback';

        function setAppHeight() {
            try {
                const doc = document.documentElement;
                const viewportHeight = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
                doc.style.setProperty('--app-height', `${viewportHeight}px`);
                console.debug(`Set app height to ${viewportHeight}px`);
            } catch (error) {
                console.error('Error in setAppHeight:', error);
            }
        }

        function calculateGridSize() {
            try {
                const screenWidth = window.innerWidth;
                const screenHeight = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight) - 20; // Buffer for UI

                const baseTileSize = 200;
                const minTileSize = 100;
                const maxTileSize = 250;

                // Estimate columns and rows
                const estColumns = Math.floor(screenWidth / baseTileSize);
                const estRows = Math.floor(screenHeight / baseTileSize);

                // Ensure minimum grid size
                const targetColumns = Math.max(3, estColumns);
                const targetRows = Math.max(3, estRows);

                // Calculate tile size
                const widthBasedSize = Math.floor(screenWidth / targetColumns);
                const heightBasedSize = Math.floor(screenHeight / targetRows);
                let tileSize = Math.min(widthBasedSize, heightBasedSize, maxTileSize);

                // Ensure tile size is valid
                tileSize = Math.max(tileSize, minTileSize);

                // Adjust to fit integer rows
                let finalRows = Math.floor(screenHeight / tileSize);
                if (finalRows < 3) finalRows = 3; // Minimum rows
                tileSize = Math.floor(screenHeight / finalRows);
                tileSize = Math.min(tileSize, maxTileSize);
                tileSize = Math.max(tileSize, minTileSize);

                const finalColumns = Math.ceil(screenWidth / tileSize);

                document.documentElement.style.setProperty('--tile-size', `${tileSize}px`);
                console.debug(`Grid calculated: tileSize=${tileSize}px, columns=${finalColumns}, rows=${finalRows}, screen=${screenWidth}x${screenHeight}`);

                return { columns: finalColumns, rows: finalRows, tileSize };
            } catch (error) {
                console.error('Error in calculateGridSize:', error);
                return { columns: 4, rows: 4, tileSize: 100 }; // Fallback
            }
        }

        function debounceResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                setAppHeight();
                calculateGridSize();
                createGrid();
            }, 200);
        }

        window.addEventListener('resize', debounceResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(debounceResize, 100);
        });
        setAppHeight();

        function createStars() {
            try {
                const starfield = document.getElementById('starfield');
                starfield.innerHTML = '';
                stars = [];

                for (let i = 0; i < 100; i++) {
                    let star = document.createElement('div');
                    star.classList.add('star');

                    let xPos = Math.random() * window.innerWidth;
                    let yPos = Math.random() * window.innerHeight;

                    star.style.left = xPos + 'px';
                    star.style.top = yPos + 'px';

                    let size = Math.random() * 2 + 1;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';

                    star.style.opacity = Math.random() * 0.7 + 0.3;

                    let speed = Math.random() * 0.2 + 0.1;

                    stars.push({
                        element: star,
                        x: xPos,
                        y: yPos,
                        speed: speed
                    });

                    starfield.appendChild(star);
                }
            } catch (error) {
                console.error('Error in createStars:', error);
            }
        }

        function animateStars() {
            function animate() {
                try {
                    stars.forEach(star => {
                        star.x -= star.speed;

                        if (star.x < -10) {
                            star.x = window.innerWidth + 10;
                            star.y = Math.random() * window.innerHeight;
                        }

                        star.element.style.left = star.x + 'px';
                    });

                    requestAnimationFrame(animate);
                } catch (error) {
                    console.error('Error in animateStars:', error);
                }
            }

            animate();
        }

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                if (imageCache[url]) {
                    resolve(imageCache[url]);
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    imageCache[url] = img;
                    resolve(img);
                };
                img.onerror = () => {
                    console.warn(`Failed to load image: ${url}`);
                    resolve(null); // Resolve with null instead of rejecting
                };
                img.src = url;
            });
        }

        async function loadCSV() {
            try {
                const response = await fetch("https://chineseffect.com/chfx/words.csv");
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const text = await response.text();
                const rows = text.trim().split("\n");
                const headers = rows[0].split(",").map(h => h.trim());
                const nameOfSiteIndex = headers.indexOf("nameOfSite");
                const charactersIndex = headers.indexOf("characters");

                if (nameOfSiteIndex === -1 || charactersIndex === -1) {
                    console.warn('CSV headers missing nameOfSite or characters');
                    return;
                }

                wordsList = [];
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(",").map(col => col.trim());
                    const nameOfSite = cols[nameOfSiteIndex];
                    if (!nameOfSite || nameOfSite.trim() === '') continue;
                    wordsList.push({ 
                        nameOfSite: nameOfSite, 
                        characters: cols[charactersIndex],
                        characterCount: cols[charactersIndex]?.length || 0
                    });
                }

                console.debug(`Loaded ${wordsList.length} words from CSV`);
                await loadDecomposedSentencesCSV();
                createGrid();
            } catch (error) {
                console.error("Error loading CSV:", error);
                wordsList = []; // Ensure grid creation can proceed
                createGrid();
            }
        }

        async function loadDecomposedSentencesCSV() {
            try {
                const response = await fetch("https://chineseffect.com/chfx/sentencesDecomposed.csv");
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const text = await response.text();
                const rows = text.trim().split("\n");
                const headers = rows[0].split(",").map(h => h.trim());
                const sentenceCodeIndex = headers.indexOf("sentenceCode");

                if (sentenceCodeIndex === -1) {
                    console.warn('CSV header missing sentenceCode');
                    return;
                }

                decomposedSentencesList = [];
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(",").map(col => col.trim());
                    if (cols[sentenceCodeIndex]) {
                        decomposedSentencesList.push(cols[sentenceCodeIndex]);
                    }
                }
                console.debug(`Loaded ${decomposedSentencesList.length} decomposed sentences`);
            } catch (error) {
                console.error("Error loading decomposed sentences CSV:", error);
                decomposedSentencesList = [];
            }
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        async function createGrid() {
            try {
                const gridContainer = document.getElementById('grid-container');
                if (!gridContainer) throw new Error('Grid container not found');
                gridContainer.innerHTML = '';
                gridTiles = [];
                usedWordIndexes.clear();

                const { columns, rows, tileSize } = calculateGridSize();
                if (tileSize <= 0 || isNaN(tileSize)) throw new Error(`Invalid tileSize: ${tileSize}`);

                if (wordsList.length === 0) {
                    console.warn('No words available, skipping grid creation');
                    return;
                }

                const patternSeed = Math.random();
                
                let singleCharWords = shuffleArray(wordsList.filter(w => w.characterCount === 1));
                let doubleCharWords = shuffleArray(wordsList.filter(w => w.characterCount === 2));
                let tripleCharWords = shuffleArray(wordsList.filter(w => w.characterCount === 3));

                const tileCount = Math.ceil(columns * rows * 1.2);

                let charCounts = [];
                if (patternSeed < 0.33) {
                    charCounts = [1, 1, 1, 1, 2, 3];
                } else if (patternSeed < 0.66) {
                    charCounts = [1, 2, 2, 2, 3, 3];
                } else {
                    charCounts = [1, 1, 2, 2, 3, 3];
                }

                const startingOffset = Math.floor(Math.random() * 10);

                for (let i = 0; i < tileCount; i++) {
                    const charCount = charCounts[(i + startingOffset) % charCounts.length];
                    let wordData, wordIndex;
                    let attempts = 0;
                    const maxAttempts = 10;

                    do {
                        if (charCount === 1) {
                            wordData = singleCharWords[Math.floor(Math.random() * singleCharWords.length)];
                        } else if (charCount === 2) {
                            wordData = doubleCharWords[Math.floor(Math.random() * doubleCharWords.length)];
                        } else {
                            wordData = tripleCharWords[Math.floor(Math.random() * tripleCharWords.length)];
                        }
                        wordIndex = wordData ? wordsList.findIndex(w => w.nameOfSite === wordData.nameOfSite) : -1;
                        attempts++;
                    } while (wordIndex === -1 || (usedWordIndexes.has(wordIndex) && attempts < maxAttempts));

                    if (wordIndex === -1) {
                        console.warn(`No valid word found for charCount ${charCount}, skipping tile`);
                        continue;
                    }

                    usedWordIndexes.add(wordIndex);
                    if (usedWordIndexes.size > wordsList.length * 0.3) {
                        usedWordIndexes.clear();
                    }

                    const imageUrl = `https://chineseffect.com/images/wordsTiles/${wordData.nameOfSite}.webp?t=${Date.now()}`;

                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    const tileInner = document.createElement('div');
                    tileInner.className = 'tile-inner';

                    const tileFront = document.createElement('div');
                    tileFront.className = 'tile-front';

                    const tileBack = document.createElement('div');
                    tileBack.className = 'tile-back';

                    const imgFront = document.createElement('img');
                    imgFront.src = FALLBACK_IMAGE;
                    imgFront.alt = wordData.characters || '';
                    imgFront.dataset.wordIndex = wordIndex;
                    imgFront.dataset.src = imageUrl;
                    imgFront.loading = 'lazy';
                    imgFront.onerror = () => {
                        imgFront.onerror = null;
                        imgFront.src = SECONDARY_FALLBACK_IMAGE;
                    };

                    const imgBack = document.createElement('img');
                    imgBack.src = FALLBACK_IMAGE;
                    imgBack.alt = wordData.characters || '';
                    imgBack.dataset.wordIndex = wordIndex;
                    imgBack.dataset.src = imageUrl;
                    imgBack.loading = 'lazy';
                    imgBack.onerror = () => {
                        imgBack.onerror = null;
                        imgBack.src = SECONDARY_FALLBACK_IMAGE;
                    };

                    tileFront.appendChild(imgFront);
                    tileBack.appendChild(imgBack);
                    tileInner.appendChild(tileFront);
                    tileInner.appendChild(tileBack);
                    tile.appendChild(tileInner);

                    tile.addEventListener('click', handleTileClick);

                    gridContainer.appendChild(tile);

                    const initialTime = Date.now() + (Math.random() * 5000);

                    gridTiles.push({
                        element: tile,
                        inner: tileInner,
                        front: tileFront,
                        back: tileBack,
                        frontImg: imgFront,
                        backImg: imgBack,
                        characterCount: charCount,
                        currentWordIndex: wordIndex,
                        isFlipping: false,
                        nextChangeTime: initialTime
                    });
                }

                gridContainer.style.display = 'grid';
                gridContainer.style.opacity = '1';
                console.debug(`Created grid with ${gridTiles.length} tiles`);

                loadImagesInBatches();
            } catch (error) {
                console.error('Error in createGrid:', error);
            }
        }

        async function loadImagesInBatches() {
            try {
                const batchSize = 10;
                const delayBetweenBatches = 100;

                for (let i = 0; i < gridTiles.length; i += batchSize) {
                    const batch = gridTiles.slice(i, i + batchSize);
                    const promises = batch.map(async (tile) => {
                        const url = tile.frontImg.dataset.src;
                        try {
                            const img = await preloadImage(url);
                            if (img) {
                                tile.frontImg.src = url;
                                tile.backImg.src = url;
                            }
                        } catch (error) {
                            console.warn(`Failed to preload image: ${url}`);
                        }
                    });
                    await Promise.all(promises);
                    await new Promise(resolve => setTimeout(resolve, delayBetweenBatches));
                }
            } catch (error) {
                console.error('Error in loadImagesInBatches:', error);
            }
        }

        async function updateTiles() {
            try {
                const now = Date.now();

                for (const tile of gridTiles) {
                    if (!tile.isFlipping && now >= tile.nextChangeTime) {
                        tile.isFlipping = true;

                        const sameCharWords = wordsList.filter(w => w.characterCount === tile.characterCount);
                        if (sameCharWords.length === 0) {
                            tile.isFlipping = false;
                            tile.nextChangeTime = now + 2000;
                            continue;
                        }

                        let newWordIndex;
                        let attempts = 0;
                        const maxAttempts = 15;

                        do {
                            const randomWord = sameCharWords[Math.floor(Math.random() * sameCharWords.length)];
                            newWordIndex = wordsList.findIndex(w => w.nameOfSite === randomWord.nameOfSite);
                            attempts++;
                        } while ((newWordIndex === tile.currentWordIndex || usedWordIndexes.has(newWordIndex) || newWordIndex === -1) && attempts < maxAttempts);

                        if (newWordIndex === tile.currentWordIndex || newWordIndex === -1 || !wordsList[newWordIndex]) {
                            const availableWords = sameCharWords.filter(w => {
                                const idx = wordsList.findIndex(word => word.nameOfSite === w.nameOfSite);
                                return idx !== tile.currentWordIndex && !usedWordIndexes.has(idx) && idx !== -1;
                            });

                            if (availableWords.length === 0) {
                                tile.isFlipping = false;
                                tile.nextChangeTime = now + 2000;
                                usedWordIndexes.clear();
                                continue;
                            }

                            const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
                            newWordIndex = wordsList.findIndex(w => w.nameOfSite === randomWord.nameOfSite);
                        }

                        usedWordIndexes.add(newWordIndex);
                        if (usedWordIndexes.size > wordsList.length * 0.3) {
                            usedWordIndexes.clear();
                        }

                        const newWord = wordsList[newWordIndex];
                        const newImageUrl = `https://chineseffect.com/images/wordsTiles/${newWord.nameOfSite}.webp?t=${Date.now()}`;

                        try {
                            const img = await preloadImage(newImageUrl);
                            if (!img) throw new Error(`Image preload failed for ${newImageUrl}`);

                            tile.inner.className = 'tile-inner';
                            tile.inner.classList.add('flipping');

                            setTimeout(() => {
                                try {
                                    const newFrontImg = document.createElement('img');
                                    newFrontImg.src = newImageUrl;
                                    newFrontImg.alt = newWord.characters || '';
                                    newFrontImg.dataset.wordIndex = newWordIndex;
                                    newFrontImg.dataset.src = newImageUrl;
                                    newFrontImg.loading = 'lazy';
                                    newFrontImg.onerror = () => {
                                        newFrontImg.onerror = null;
                                        newFrontImg.src = SECONDARY_FALLBACK_IMAGE;
                                    };

                                    const newBackImg = document.createElement('img');
                                    newBackImg.src = newImageUrl;
                                    newBackImg.alt = newWord.characters || '';
                                    newBackImg.dataset.wordIndex = newWordIndex;
                                    newBackImg.dataset.src = newImageUrl;
                                    newBackImg.loading = 'lazy';
                                    newBackImg.onerror = () => {
                                        newBackImg.onerror = null;
                                        newBackImg.src = SECONDARY_FALLBACK_IMAGE;
                                    };

                                    tile.front.innerHTML = '';
                                    tile.back.innerHTML = '';
                                    tile.front.appendChild(newFrontImg);
                                    tile.back.appendChild(newBackImg);

                                    tile.frontImg = newFrontImg;
                                    tile.backImg = newBackImg;
                                    tile.currentWordIndex = newWordIndex;

                                    tile.inner.className = 'tile-inner';
                                    tile.inner.classList.add('appearing');
                                } catch (error) {
                                    console.error('Error updating tile images:', error);
                                }
                            }, 600);

                            setTimeout(() => {
                                tile.isFlipping = false;
                                tile.nextChangeTime = now + (5000 + Math.random() * 10000);
                            }, 1200);
                        } catch (error) {
                            console.warn(`Failed to update tile: ${error.message}`);
                            tile.isFlipping = false;
                            tile.nextChangeTime = now + 2000;
                        }
                    }
                }
            } catch (error) {
                console.error('Error in updateTiles:', error);
            }
        }

        function handleTileClick(event) {
            try {
                let target = event.target;
                while (target && !target.dataset.wordIndex) {
                    target = target.querySelector('img') || target.parentElement;
                }

                if (target && target.dataset.wordIndex) {
                    const wordIndex = parseInt(target.dataset.wordIndex);
                    selectWord(wordIndex);
                }
            } catch (error) {
                console.error('Error in handleTileClick:', error);
            }
        }

        async function findRelatedSentences() {
            try {
                relatedSentences = [];
                displayMode = "";
                sentenceForAnimation = "";

                const response = await fetch("https://chineseffect.com/chfx/speechRecognition.csv");
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const text = await response.text();
                const rows = text.trim().split("\n");
                const headers = rows[0].split(",").map(h => h.trim());
                const chineseVersionIndex = headers.indexOf("chineseVersion");
                const nameOfSiteIndex = headers.indexOf("nameOfSite");

                if (chineseVersionIndex === -1 || nameOfSiteIndex === -1) {
                    console.warn('CSV headers missing chineseVersion or nameOfSite');
                    return;
                }

                let matchingSentences = [];
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(",").map(col => col.trim());
                    if (cols[chineseVersionIndex]?.includes(selectedWord)) {
                        matchingSentences.push(cols[nameOfSiteIndex]);
                    }
                }

                if (matchingSentences.length > 0) {
                    currentSentenceName = matchingSentences[0];

                    if (decomposedSentencesList.includes(currentSentenceName)) {
                        displayMode = "decomposed";
                    } else {
                        let sentencePath = `https://chineseffect.com/images/${currentSentenceName}.webp`;
                        try {
                            let response = await fetch(sentencePath, { method: 'HEAD' });
                            if (response.ok) {
                                displayMode = "webp";
                                relatedSentences.push(sentencePath);
                                await preloadImage(sentencePath);
                            } else {
                                displayMode = "animated";
                                sentenceForAnimation = currentSentenceName;
                            }
                        } catch (e) {
                            console.warn(`Error checking sentence image: ${e.message}`);
                            displayMode = "animated";
                            sentenceForAnimation = currentSentenceName;
                        }
                    }
                }
                console.debug(`Found ${matchingSentences.length} related sentences, displayMode=${displayMode}`);
            } catch (error) {
                console.error("Error finding related sentences:", error);
            }
        }

        function playSentenceAudio() {
            try {
                if (currentSentenceName) {
                    const audioPath = `https://chineseffect.com/audio/random/${currentSentenceName}.mp3`;
                    const audio = new Audio(audioPath);
                    audio.onerror = function() {
                        const altAudioPath = `https://chineseffect.com/audio/${currentSentenceName}.mp3`;
                        const altAudio = new Audio(altAudioPath);
                        altAudio.play().catch(e => console.error("Error playing fallback audio:", e));
                    };
                    audio.play().catch(e => console.error("Error playing audio:", e));
                }
            } catch (error) {
                console.error('Error in playSentenceAudio:', error);
            }
        }

        async function selectWord(index) {
            try {
                if (index < 0 || index >= wordsList.length) {
                    console.warn(`Invalid word index: ${index}`);
                    return;
                }

                activeWordIndex = index;
                selectedWord = wordsList[index].characters;

                historyStack.push({ step: 1, index: index });
                currentIndex++;

                let gridContainer = document.getElementById("grid-container");
                gridContainer.style.opacity = "0";
                await new Promise(resolve => setTimeout(resolve, 500));
                gridContainer.style.display = "none";

                let contentFrame = document.getElementById("contentFrame");
                contentFrame.src = `https://chineseffect.com/chfx/words.html?page=${wordsList[index].nameOfSite}`;
                contentFrame.style.display = "block";

                await new Promise(resolve => setTimeout(resolve, 50));
                contentFrame.style.opacity = "1";

                let navigation = document.getElementById("navigation");
                navigation.style.display = "flex";
                await new Promise(resolve => setTimeout(resolve, 50));
                navigation.style.opacity = "1";

                step = 1;

                await findRelatedSentences();
            } catch (error) {
                console.error("Error selecting word:", error);
            }
        }

        async function transitionToNextStep() {
            try {
                if (step === 1) {
                    if (displayMode === "decomposed") {
                        step = 2;
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        contentFrame.src = `https://chineseffect.com/chfx/sentenceDecomposed.html?page=${currentSentenceName}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else if (displayMode === "webp") {
                        step = 2;
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        contentFrame.style.display = "none";
                        let sentenceImage = document.getElementById("sentenceImage");
                        sentenceImage.src = relatedSentences[0];
                        sentenceImage.style.display = "block";
                        if (!sentenceImage.complete) {
                            await new Promise((resolve) => {
                                sentenceImage.onload = resolve;
                                sentenceImage.onerror = resolve;
                            });
                        }
                        await new Promise(resolve => setTimeout(resolve, 50));
                        sentenceImage.style.opacity = "1";
                        document.getElementById('starfield').style.display = 'block';
                    } else if (displayMode === "animated") {
                        step = 2;
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        contentFrame.src = `https://chineseffect.com/chfx/animatedSentences.html?page=${currentSentenceName}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else {
                        resetToGrid();
                    }
                } else if (step === 2) {
                    step = 3;
                    if (displayMode === "decomposed" || displayMode === "animated") {
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        contentFrame.src = `https://chineseffect.com/chfx/saycompare.html?page=${currentSentenceName}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else {
                        let sentenceImage = document.getElementById("sentenceImage");
                        sentenceImage.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        sentenceImage.style.display = "none";
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.src = `https://chineseffect.com/chfx/saycompare.html?page=${currentSentenceName}`;
                        contentFrame.style.display = "block";
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    }
                } else if (step === 3) {
                    resetToGrid();
                }
            } catch (error) {
                console.error("Error transitioning to next step:", error);
            }
        }

        async function transitionToPreviousStep() {
            try {
                if (step === 1) {
                    resetToGrid();
                } else if (step === 2) {
                    step = 1;
                    if (displayMode === "decomposed" || displayMode === "animated") {
                        let contentFrame = document.getElementById("contentFrame");
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        let newIndex = historyStack[currentIndex].index;
                        contentFrame.src = `https://chineseffect.com/chfx/words.html?page=${wordsList[newIndex].nameOfSite}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else {
                        let sentenceImage = document.getElementById("sentenceImage");
                        sentenceImage.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        sentenceImage.style.display = "none";
                        let contentFrame = document.getElementById("contentFrame");
                        let newIndex = historyStack[currentIndex].index;
                        contentFrame.src = `https://chineseffect.com/chfx/words.html?page=${wordsList[newIndex].nameOfSite}`;
                        contentFrame.style.display = "block";
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    }
                } else if (step === 3) {
                    step = 2;
                    let contentFrame = document.getElementById("contentFrame");
                    contentFrame.style.opacity = "0";
                    await new Promise(resolve => setTimeout(resolve, 500));
                    if (displayMode === "decomposed") {
                        contentFrame.src = `https://chineseffect.com/chfx/sentenceDecomposed.html?page=${currentSentenceName}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else if (displayMode === "animated") {
                        contentFrame.src = `https://chineseffect.com/chfx/animatedSentences.html?page=${currentSentenceName}`;
                        await new Promise(resolve => setTimeout(resolve, 50));
                        contentFrame.style.opacity = "1";
                    } else {
                        contentFrame.style.display = "none";
                        let sentenceImage = document.getElementById("sentenceImage");
                        sentenceImage.style.display = "block";
                        await new Promise(resolve => setTimeout(resolve, 50));
                        sentenceImage.style.opacity = "1";
                        document.getElementById('starfield').style.display = 'block';
                    }
                }
            } catch (error) {
                console.error("Error transitioning to previous step:", error);
            }
        }

        async function resetToGrid() {
            try {
                if (step === 3 || step === 2 || step === 1) {
                    const contentFrame = document.getElementById("contentFrame");
                    const sentenceImage = document.getElementById("sentenceImage");
                    const navigation = document.getElementById("navigation");

                    if (contentFrame.style.display !== "none") {
                        contentFrame.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        contentFrame.style.display = "none";
                    }

                    if (sentenceImage.style.display !== "none") {
                        sentenceImage.style.opacity = "0";
                        await new Promise(resolve => setTimeout(resolve, 500));
                        sentenceImage.style.display = "none";
                    }

                    navigation.style.opacity = "0";
                    await new Promise(resolve => setTimeout(resolve, 500));
                    navigation.style.display = "none";

                    const gridContainer = document.getElementById("grid-container");
                    createGrid();
                    
                    gridContainer.style.display = "grid";
                    await new Promise(resolve => setTimeout(resolve, 50));
                    gridContainer.style.opacity = "1";

                    step = 0;
                }
            } catch (error) {
                console.error("Error resetting to grid:", error);
            }
        }

        function resetApp() {
            try {
                window.location.reload();
            } catch (error) {
                console.error('Error in resetApp:', error);
            }
        }

        document.getElementById("nextButton").addEventListener("click", function() {
            transitionToNextStep();
        });

        document.getElementById("backButton").addEventListener("click", function() {
            transitionToPreviousStep();
        });

        document.getElementById("guideButton").addEventListener("click", function() {
            resetToGrid();
        });

        function fixMobileHeight() {
            try {
                setAppHeight();
                window.scrollTo(0, 1);
                const viewportHeight = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
                document.documentElement.style.height = `${viewportHeight}px`;
                document.body.style.height = `${viewportHeight}px`;
                calculateGridSize();
                createGrid();
            } catch (error) {
                console.error('Error in fixMobileHeight:', error);
            }
        }

        window.addEventListener('load', () => {
            try {
                fixMobileHeight();
                setTimeout(fixMobileHeight, 500); // Handle delayed viewport stabilization
                loadCSV();
                createStars();
                animateStars();
                setInterval(updateTiles, 500);
            } catch (error) {
                console.error('Error in window load handler:', error);
            }
        });
    </script>
</body>
</html>
