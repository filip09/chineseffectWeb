<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Chineseffect</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Lato', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .message {
      max-width: 480px;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 300;
      line-height: 1.75;
      color: #ffffff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.45);
      margin-bottom: 2rem;
      letter-spacing: 0.01em;
    }

    .message strong {
      font-weight: 700;
      color: #40DCA5;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="message">
      <strong>Every act of giving returns to the giver.</strong><br>
      This project is a living channel — energy sent here flows into
      something real, multiplies, and finds its way back to you.
      You're not donating. You're investing in your own good fortune.
    </p>
    <div class="button-wrap">
      <script
        type="text/javascript"
        src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
        data-name="bmc-button"
        data-slug="chineseffect"
        data-color="#40DCA5"
        data-emoji="༄"
        data-font="Lato"
        data-text="Support your money flow"
        data-outline-color="#000000"
        data-font-color="#ffffff"
        data-coffee-color="#FFDD00"
      ></script>
    </div>
  </div>
</body>
</html>
