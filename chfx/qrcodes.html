<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic QR Code Grid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        #grid-container {
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        
        .qr-tile {
            position: absolute;
            background-color: #000;
            box-sizing: border-box;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Use transform for smoother animations */
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1),
                        width 1.2s cubic-bezier(0.25, 0.1, 0.25, 1),
                        height 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform, width, height;
        }
        
        .qr-tile canvas {
            max-width: 100%;
            max-height: 100%;
        }
        
        .qr-container {
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        
        .fading {
            opacity: 0;
        }
        
        .removing {
            opacity: 0;
            transform: scale(0.1) !important;
            transition: transform 0.8s ease-out, opacity 0.8s ease-out;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            z-index: 1000;
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-family: Arial, sans-serif;
            font-size: 14px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="loading">Loading QR codes from CSV...</div>
    <div id="grid-container"></div>
    <div id="status"></div>

    <script>
        const baseSize = 80;
        const sizeFactor = {
            small: 0.5,
            medium: 1,
            large: 2
        };
        
        let currentMode = 'evolve';
        let evolutionDirection = Math.random() > 0.5 ? 'consolidate' : 'divide';
        let evolutionProgress = 0;
        let evolutionSpeed = 5;
        
        let isPausing = false;
        let lastLayoutChange = 0;
        let minPauseBetweenChanges = 3000; // Increased to reduce frequency of changes
        let forcedPauseActive = false;
        
        let evolutionTimer = null;
        let animationTimer = null;
        let layoutUpdateDebounceTimer = null;
        
        let activeTiles = [];
        let targetPositions = [];
        let qrUrls = [];
        let currentLayout = null;
        
        // Reduced frequency of QR code refreshes
        const refreshIntervals = [7000, 10000, 15000, 20000];
        
        const qrColors = [
            "#FFFFFF",
            "#EB6548",
            "#FF9E7B",
            "#FECC6A",
            "#6B9A6E",
            "#00C0D1",
            "#82EAFF"
        ];
        
        function getRandomColor() {
            return qrColors[Math.floor(Math.random() * qrColors.length)];
        }
        
        function isValidUrl(url) {
            try {
                return url && url.trim() !== '' && 
                       (url.startsWith('http://') || url.startsWith('https://'));
            } catch (e) {
                return false;
            }
        }
        
        // Simplified data fetching with caching
        let cachedUrls = null;
        async function fetchQRCodeData() {
            if (cachedUrls) return cachedUrls;
            
            try {
                const response = await fetch('https://chineseffect.com/chfx/qrcodes.csv', {
                    mode: 'cors',
                    headers: {
                        'Accept': 'text/csv'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.text();
                
                const rows = data.split('\n');
                if (rows.length <= 1) {
                    return generateFallbackUrls();
                }
                
                const headers = rows[0].split(',');
                const qrcodeIndex = headers.findIndex(header => 
                    header.trim().toLowerCase() === 'qrcode');
                
                if (qrcodeIndex === -1) {
                    return generateFallbackUrls();
                }
                
                const urls = [];
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    
                    const cells = rows[i].split(',');
                    if (cells.length > qrcodeIndex && isValidUrl(cells[qrcodeIndex])) {
                        urls.push(cells[qrcodeIndex].trim());
                    }
                }
                
                if (urls.length === 0) {
                    return generateFallbackUrls();
                }
                
                cachedUrls = urls;
                return urls;
            } catch (error) {
                return generateFallbackUrls();
            }
        }
        
        function generateFallbackUrls() {
            return [
                'https://example.com/1',
                'https://example.com/2',
                'https://example.com/3',
                'https://example.com/4',
                'https://example.com/5'
            ];
        }
        
        function getRandomUrl() {
            if (qrUrls.length === 0) {
                return 'https://example.com';
            }
            return qrUrls[Math.floor(Math.random() * qrUrls.length)];
        }
        
        function createQrTile(sizeCategory, url, x, y) {
            const tile = document.createElement('div');
            tile.className = 'qr-tile';
            
            const factor = sizeFactor[sizeCategory];
            const size = baseSize * factor;
            
            tile.style.width = `${size}px`;
            tile.style.height = `${size}px`;
            
            // Use transform for positioning instead of left/top
            tile.style.transform = `translate(${x}px, ${y}px)`;
            
            tile.dataset.x = x;
            tile.dataset.y = y;
            tile.dataset.width = size;
            tile.dataset.height = size;
            tile.dataset.sizeCategory = sizeCategory;
            
            const qrContainer = document.createElement('div');
            qrContainer.className = 'qr-container';
            tile.appendChild(qrContainer);
            
            const color = getRandomColor();
            
            new QRCode(qrContainer, {
                text: url,
                width: size * 0.9,
                height: size * 0.9,
                colorDark: color,
                colorLight: "#000000",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            tile.dataset.url = url;
            tile.dataset.color = color;
            
            tile.addEventListener('click', () => {
                window.open(tile.dataset.url, '_blank');
            });
            
            // Less frequent QR code refreshes
            const interval = getRandomInterval();
            const refresherId = setInterval(() => {
                if (Math.random() < 0.7) { // Only 70% chance to refresh
                    const newUrl = getRandomUrl();
                    updateQRCodeWithFade(tile, newUrl);
                    tile.dataset.url = newUrl;
                }
            }, interval);
            
            tile.dataset.refresherId = refresherId;
            
            return tile;
        }
        
        function updateQRCodeWithFade(tile, url) {
            const qrContainer = tile.querySelector('.qr-container');
            if (!qrContainer) return;
            
            qrContainer.classList.add('fading');
            
            setTimeout(() => {
                qrContainer.innerHTML = '';
                
                const color = getRandomColor();
                
                tile.dataset.color = color;
                
                // Use dataset values for size to avoid parsing style
                const size = parseInt(tile.dataset.width);
                new QRCode(qrContainer, {
                    text: url,
                    width: size * 0.9,
                    height: size * 0.9,
                    colorDark: color,
                    colorLight: "#000000",
                    correctLevel: QRCode.CorrectLevel.H
                });
                
                // Force reflow
                void qrContainer.offsetWidth;
                
                qrContainer.classList.remove('fading');
            }, 500);
        }
        
        function getRandomInterval() {
            return refreshIntervals[Math.floor(Math.random() * refreshIntervals.length)];
        }
        
        function getRandomPauseDuration() {
            return 4000 + Math.floor(Math.random() * 6000);
        }
        
        class Space {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.area = width * height;
            }
            
            canFit(size) {
                return this.width >= size && this.height >= size;
            }
            
            split(size) {
                const spaces = [];
                
                if (this.x + size < this.x + this.width) {
                    spaces.push(new Space(
                        this.x + size,
                        this.y,
                        this.width - size,
                        size
                    ));
                }
                
                if (this.y + size < this.y + this.height) {
                    spaces.push(new Space(
                        this.x,
                        this.y + size,
                        this.width,
                        this.height - size
                    ));
                }
                
                return spaces;
            }
        }
        
        // Memoize layout calculations to avoid redundant work
        const layoutCache = {};
        function getLayoutCacheKey() {
            return `${window.innerWidth}x${window.innerHeight}-${currentMode}-${evolutionDirection}-${Math.floor(evolutionProgress/10)}`;
        }
        
        function calculateTileLayout() {
            const cacheKey = getLayoutCacheKey();
            
            // Check if we have a cached layout
            if (layoutCache[cacheKey]) {
                return layoutCache[cacheKey];
            }
            
            let spaces = [new Space(0, 0, window.innerWidth, window.innerHeight)];
            const layouts = [];
            
            let sizeWeights = {
                small: 1.0,
                medium: 1.0,
                large: 1.0
            };
            
            let effectiveMode = currentMode;
            
            if (currentMode === 'evolve') {
                effectiveMode = evolutionDirection;
                
                const progress = evolutionProgress / 100;
                
                if (evolutionDirection === 'consolidate') {
                    sizeWeights.small = 2.0 - (1.8 * progress);
                    sizeWeights.medium = 0.8 + (0.2 * progress);
                    sizeWeights.large = 0.2 + (1.8 * progress);
                } else {
                    sizeWeights.small = 0.2 + (1.8 * progress);
                    sizeWeights.medium = 0.8 + (0.2 * progress);
                    sizeWeights.large = 2.0 - (1.8 * progress);
                }
            } else if (effectiveMode === 'consolidate') {
                sizeWeights.small = 0.2;
                sizeWeights.medium = 0.8;
                sizeWeights.large = 2.0;
            } else if (effectiveMode === 'divide') {
                sizeWeights.small = 2.0;
                sizeWeights.medium = 0.8;
                sizeWeights.large = 0.2;
            }
            
            function selectSizeCategory(space, possibleSizes) {
                let totalWeight = 0;
                const weights = {};
                
                possibleSizes.forEach(size => {
                    let weight = sizeWeights[size];
                    
                    const sizePx = baseSize * sizeFactor[size];
                    const fitRatio = Math.min(space.width / sizePx, space.height / sizePx);
                    
                    if (fitRatio >= 0.85 && fitRatio <= 1.15) {
                        weight *= 1.5;
                    }
                    
                    weights[size] = weight;
                    totalWeight += weight;
                });
                
                const random = Math.random() * totalWeight;
                let cumulativeWeight = 0;
                
                for (const size of possibleSizes) {
                    cumulativeWeight += weights[size];
                    if (random <= cumulativeWeight) {
                        return size;
                    }
                }
                
                return possibleSizes[possibleSizes.length - 1];
            }
            
            const totalArea = window.innerWidth * window.innerHeight;
            let coveredArea = 0;
            const targetCoverage = 0.95;
            
            // Limit the number of iterations to prevent excessive computation
            let iterationLimit = 1000;
            
            while (spaces.length > 0 && coveredArea / totalArea < targetCoverage && iterationLimit > 0) {
                iterationLimit--;
                
                if (effectiveMode === 'consolidate') {
                    spaces.sort((a, b) => b.area - a.area);
                } else if (effectiveMode === 'divide') {
                    spaces.sort((a, b) => a.area - b.area);
                } else {
                    spaces.sort((a, b) => (b.area - a.area) * (0.5 + Math.random()));
                }
                
                const space = spaces.shift();
                
                let possibleSizes = [];
                if (space.canFit(baseSize * sizeFactor.small)) possibleSizes.push('small');
                if (space.canFit(baseSize * sizeFactor.medium)) possibleSizes.push('medium');
                if (space.canFit(baseSize * sizeFactor.large)) possibleSizes.push('large');
                
                if (possibleSizes.length === 0) continue;
                
                const sizeCategory = selectSizeCategory(space, possibleSizes);
                const tileSize = baseSize * sizeFactor[sizeCategory];
                
                layouts.push({
                    x: space.x,
                    y: space.y,
                    width: tileSize,
                    height: tileSize,
                    sizeCategory: sizeCategory
                });
                
                coveredArea += tileSize * tileSize;
                
                const newSpaces = space.split(tileSize);
                spaces = spaces.concat(newSpaces);
            }
            
            // Cache the result
            layoutCache[cacheKey] = layouts;
            
            // Keep cache size reasonable
            const cacheKeys = Object.keys(layoutCache);
            if (cacheKeys.length > 10) {
                delete layoutCache[cacheKeys[0]];
            }
            
            return layouts;
        }
        
        function updateTilePositions() {
            if (forcedPauseActive) return;
            
            const now = Date.now();
            const timeSinceLastChange = now - lastLayoutChange;
            
            if (timeSinceLastChange < minPauseBetweenChanges) {
                forcedPauseActive = true;
                const remainingPauseTime = minPauseBetweenChanges - timeSinceLastChange;
                
                document.getElementById('status').textContent = 
                    `Enforcing pause between layout changes (${Math.ceil(remainingPauseTime/1000)}s remaining)...`;
                
                setTimeout(() => {
                    forcedPauseActive = false;
                    document.getElementById('status').textContent = 
                        `Evolution: ${evolutionDirection} (${Math.floor(evolutionProgress)}%)`;
                    
                    // Use requestAnimationFrame for smoother update
                    requestAnimationFrame(() => updateTilePositions());
                }, remainingPauseTime);
                
                return;
            }
            
            const container = document.getElementById('grid-container');
            const existingTiles = Array.from(container.querySelectorAll('.qr-tile'))
                                        .filter(tile => !tile.classList.contains('removing'));
            
            if (layoutUpdateDebounceTimer) {
                clearTimeout(layoutUpdateDebounceTimer);
            }
            
            // Debounce the layout calculation to avoid thrashing
            layoutUpdateDebounceTimer = setTimeout(() => {
                const targetLayouts = calculateTileLayout();
                currentLayout = targetLayouts;
                targetPositions = targetLayouts;
                
                if (existingTiles.length === 0) {
                    // First time creation
                    targetLayouts.forEach(layout => {
                        const url = getRandomUrl();
                        const tile = createQrTile(layout.sizeCategory, url, layout.x, layout.y);
                        container.appendChild(tile);
                        activeTiles.push(tile);
                    });
                } else {
                    // Handle tile count changes in batches for smoother transitions
                    if (existingTiles.length < targetLayouts.length) {
                        // Need to add tiles - do it gradually
                        const tilesToAdd = Math.min(
                            targetLayouts.length - existingTiles.length,
                            Math.max(1, Math.floor((targetLayouts.length - existingTiles.length) / 3))
                        );
                        
                        for (let i = 0; i < tilesToAdd; i++) {
                            const randomExisting = existingTiles[Math.floor(Math.random() * existingTiles.length)];
                            const x = parseInt(randomExisting.dataset.x);
                            const y = parseInt(randomExisting.dataset.y);
                            
                            const layout = targetLayouts[existingTiles.length + i];
                            const url = getRandomUrl();
                            
                            const tile = createQrTile(layout.sizeCategory, url, x, y);
                            container.appendChild(tile);
                            existingTiles.push(tile);
                            activeTiles.push(tile);
                        }
                    } else if (existingTiles.length > targetLayouts.length) {
                        // Need to remove tiles - do it gradually
                        const tilesToRemove = Math.min(
                            existingTiles.length - targetLayouts.length,
                            Math.max(1, Math.floor((existingTiles.length - targetLayouts.length) / 3))
                        );
                        
                        for (let i = 0; i < tilesToRemove; i++) {
                            const index = existingTiles.length - 1 - i;
                            const tile = existingTiles[index];
                            tile.classList.add('removing');
                            
                            setTimeout(() => {
                                if (tile.dataset.refresherId) {
                                    clearInterval(parseInt(tile.dataset.refresherId));
                                }
                                
                                if (tile.parentNode) {
                                    tile.parentNode.removeChild(tile);
                                }
                                
                                const tileIndex = activeTiles.indexOf(tile);
                                if (tileIndex !== -1) activeTiles.splice(tileIndex, 1);
                            }, 1200);
                        }
                        
                        // Update the active tiles list
                        activeTiles = existingTiles.filter(tile => !tile.classList.contains('removing'));
                    }
                }
                
                // Use requestAnimationFrame for smoother animation
                requestAnimationFrame(animateTilesToTargets);
                
                lastLayoutChange = now;
            }, 50); // Small delay to batch layout calculations
        }
        
        function animateTilesToTargets() {
            if (!currentLayout || activeTiles.length === 0) return;
            
            const maxSize = Math.min(activeTiles.length, currentLayout.length);
            
            // Process only visible tiles to improve performance
            for (let i = 0; i < maxSize; i++) {
                const tile = activeTiles[i];
                if (tile.classList.contains('removing')) continue;
                
                const target = currentLayout[i];
                
                // Update size attributes in dataset
                tile.dataset.width = target.width;
                tile.dataset.height = target.height;
                
                // Update styles
                tile.style.width = `${target.width}px`;
                tile.style.height = `${target.height}px`;
                tile.style.transform = `translate(${target.x}px, ${target.y}px)`;
                
                // Update dataset position for reference
                tile.dataset.x = target.x;
                tile.dataset.y = target.y;
                
                // Update QR code if size category changed
                if (tile.dataset.sizeCategory !== target.sizeCategory) {
                    tile.dataset.sizeCategory = target.sizeCategory;
                    
                    // Use requestAnimationFrame to stagger QR code updates
                    // This helps distribute CPU load
                    requestAnimationFrame(() => {
                        updateQRCodeWithFade(tile, tile.dataset.url);
                    });
                }
            }
        }
        
        function pauseEvolution(message) {
            if (isPausing) return;
            
            isPausing = true;
            
            if (evolutionTimer) {
                clearInterval(evolutionTimer);
                evolutionTimer = null;
            }
            
            document.getElementById('status').textContent = message || 'Evolution: pausing...';
            
            const pauseDuration = getRandomPauseDuration();
            
            setTimeout(() => {
                isPausing = false;
                
                if (currentMode === 'evolve') {
                    document.getElementById('status').textContent = 
                        `Evolution: ${evolutionDirection} (${Math.floor(evolutionProgress)}%)`;
                    
                    evolutionTimer = setInterval(evolveGrid, 1000);
                }
            }, pauseDuration);
        }
        
        function evolveGrid() {
            if (currentMode !== 'evolve' || isPausing || forcedPauseActive) return;
            
            evolutionProgress += evolutionSpeed;
            
            document.getElementById('status').textContent = 
                `Evolution: ${evolutionDirection} (${Math.floor(evolutionProgress)}%)`;
            
            // Only call updateTilePositions every few percent to reduce CPU usage
            if (evolutionProgress % 10 < evolutionSpeed && !forcedPauseActive) {
                updateTilePositions();
            }
            
            if (evolutionProgress >= 100) {
                evolutionProgress = 0;
                
                pauseEvolution('Evolution: pausing before changing direction...');
                
                setTimeout(() => {
                    if (currentMode === 'evolve' && !isPausing) {
                        evolutionDirection = evolutionDirection === 'consolidate' ? 'divide' : 'consolidate';
                        
                        // Clear layout cache when direction changes
                        Object.keys(layoutCache).forEach(key => delete layoutCache[key]);
                    }
                }, getRandomPauseDuration());
            } 
            else if (
                (Math.abs(evolutionProgress - 25) < evolutionSpeed/2) || 
                (Math.abs(evolutionProgress - 50) < evolutionSpeed/2) || 
                (Math.abs(evolutionProgress - 75) < evolutionSpeed/2) ||
                (Math.random() < 0.02) // Reduced random pause frequency
            ) {
                pauseEvolution(`Evolution: ${evolutionDirection} (${Math.floor(evolutionProgress)}%) - pausing...`);
            }
        }
        
        function initializeGrid() {
            updateTilePositions();
            evolutionTimer = setInterval(evolveGrid, 1000);
            
            // Use requestAnimationFrame for smoother animations
            function animate() {
                animateTilesToTargets();
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        }
        
        // Use a more efficient resize handler
        function handleResize() {
            // Clear existing layout cache
            Object.keys(layoutCache).forEach(key => delete layoutCache[key]);
            updateTilePositions();
        }
        
        // Add a debounced resize handler
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 300);
        });
        
        async function loadDataAndInitialize() {
            try {
                const urls = await fetchQRCodeData();
                
                if (urls && urls.length > 0) {
                    qrUrls = urls;
                } else {
                    qrUrls = generateFallbackUrls();
                }
                
                initializeGrid();
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                document.getElementById('loading').textContent = 
                    'Error loading QR codes. Please check console for details.';
            }
        }
        
        window.addEventListener('load', loadDataAndInitialize);
    </script>
</body>
</html>
