<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chineseffect</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #background-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        #content-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 2;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 0 28px 24px;
            pointer-events: none;
        }

        .nav-home {
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background 0.2s, border-color 0.2s,
                        transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: rgba(255, 255, 255, 0.8);
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }
        .nav-home:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
            color: #fff;
        }
        .nav-home:active { transform: scale(0.94); }
        .nav-home svg { width: 18px; height: 18px; flex-shrink: 0; }
    </style>
</head>
<body>

    <iframe id="background-frame"
            src="https://chineseffect.com/chfx/chfxBackground.html"
            tabindex="-1"
            aria-hidden="true">
    </iframe>

    <iframe id="content-frame" src="" allowtransparency="true"></iframe>

    <nav class="nav-bar">
        <a class="nav-home" href="https://chineseffect.com" aria-label="Home">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9L9 3l6 6"/>
                <path d="M5 7.5V15h3v-3h2v3h3V7.5"/>
            </svg>
        </a>
    </nav>

    <script>
    (function () {

        // ── CSV helpers ──────────────────────────────────────────────────────────
        async function fetchCSV(url) {
            const res  = await fetch(url);
            const text = await res.text();
            return parseCSV(text);
        }

        function parseCSV(text) {
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            if (!lines.length) return [];
            function parseLine(line) {
                const result = []; let cur = ''; let inQ = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') {
                        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
                        else { inQ = !inQ; }
                    } else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
                    else { cur += ch; }
                }
                result.push(cur.trim());
                return result;
            }
            const headers = parseLine(lines[0]);
            const result  = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = parseLine(lines[i]);
                const entry  = {};
                for (let j = 0; j < headers.length; j++) entry[headers[j]] = values[j] || '';
                result.push(entry);
            }
            return result;
        }

        // ── Read ?page= ──────────────────────────────────────────────────────────
        const page = new URLSearchParams(window.location.search).get('page') || '';

        // ── 1. Fire all four CSV fetches immediately (parallel) ──────────────────
        const csvPromise = Promise.all([
            fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=1786045565'),
            fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=1317258846'),
            fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=2127647417').catch(() => []),
            fetchCSV('https://chineseffect.com/chfx/speechRecognition.csv')
        ]);

        // ── 2. Load the iframe in parallel ───────────────────────────────────────
        const contentFrame = document.getElementById('content-frame');
        contentFrame.src = page
            ? 'https://chineseffect.com/chfx/sentenceDecomposed.html?page=' + encodeURIComponent(page)
            : 'https://chineseffect.com/chfx/sentenceDecomposed.html';

        // ── 3. Deliver pre-fetched data as soon as both are ready ────────────────
        let iframeReady = false;
        let csvData     = null;

        function tryDeliver() {
            if (!iframeReady || !csvData) return;
            contentFrame.contentWindow.postMessage({
                type:                  'chfxPreloadData',
                sentencesData:         csvData[0],
                wordsData:             csvData[1],
                charactersData:        csvData[2],
                speechRecognitionData: csvData[3]
            }, '*');
        }

        csvPromise.then(data => { csvData = data; tryDeliver(); });

        window.addEventListener('message', function (e) {
            if (!e.data) return;
            if (e.data.type === 'chfxIframeReady') {
                iframeReady = true;
                tryDeliver();
            }
            // Inner page is starting a word-click transition — sync the parent URL
            if (e.data.type === 'chfxNavigating') {
                if (e.data.nextSentenceCode) {
                    const url = new URL(window.location.href);
                    url.searchParams.set('page', e.data.nextSentenceCode);
                    window.history.pushState({ page: e.data.nextSentenceCode }, '', url.toString());
                }
            }
        });

    })();
    </script>
</body>
</html>
