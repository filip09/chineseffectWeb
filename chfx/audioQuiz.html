<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Audio Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .quiz-area {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 2rem;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }
        
        .play-button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
            height: 120px;
            position: relative;
        }
        
        #play-button {
            width: 120px;
            height: 120px;
            cursor: pointer;
            position: relative;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #play-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        #play-icon {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 20px 0 20px 40px;
            border-color: transparent transparent transparent #333;
            margin-left: 10px;
            transition: opacity 0.3s ease;
        }
        
        #waveform {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        .option {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .option-letter {
            font-weight: bold;
            margin-right: 1rem;
            background-color: rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .option-text {
            flex-grow: 1;
        }
        
        .feedback {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.5rem;
            height: 2rem;
        }
        
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 2rem;
            color: #333;
        }
        
        @media (min-width: 768px) {
            .options-container {
                grid-template-columns: 1fr 1fr;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .option {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="background"></canvas>
    
    <div id="loader" class="loader">Loading quiz...</div>
    
    <div id="quiz-container" class="container" style="display: none;">
        <div class="quiz-area">
            <h1>Listen and Choose the Translation</h1>
            
            <div class="play-button-container">
                <div id="play-button">
                    <div id="play-icon"></div>
                    <canvas id="waveform"></canvas>
                </div>
            </div>
            
            <div class="options-container" id="options"></div>
            
            <div class="feedback" id="feedback"></div>
        </div>
    </div>
    
    <script>
        // Initialize background
        const canvas = document.getElementById('background');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let circles = [];
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            initCircles();
        }
        
        function initCircles() {
            circles = [];
            const numCircles = 15;
            
            for (let i = 0; i < numCircles; i++) {
                circles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 250 + 150,
                    hue: Math.random() * 360,
                    saturation: Math.random() * 60 + 40,
                    lightness: Math.random() * 30 + 65,
                    alpha: Math.random() * 0.4 + 0.2,
                    vx: Math.random() * 0.5 - 0.25,
                    vy: Math.random() * 0.5 - 0.25,
                    hueChange: Math.random() * 0.5 - 0.25
                });
            }
        }
        
        function drawBackground() {
            ctx.clearRect(0, 0, width, height);
            
            for (let circle of circles) {
                circle.x += circle.vx;
                circle.y += circle.vy;
                
                if (circle.x < -circle.radius) circle.x = width + circle.radius;
                if (circle.x > width + circle.radius) circle.x = -circle.radius;
                if (circle.y < -circle.radius) circle.y = height + circle.radius;
                if (circle.y > height + circle.radius) circle.y = -circle.radius;
                
                circle.hue += circle.hueChange;
                if (circle.hue > 360) circle.hue -= 360;
                if (circle.hue < 0) circle.hue += 360;
                
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(
                    circle.x, circle.y, 0,
                    circle.x, circle.y, circle.radius
                );
                gradient.addColorStop(0, `hsla(${circle.hue}, ${circle.saturation}%, ${circle.lightness}%, ${circle.alpha})`);
                gradient.addColorStop(1, `hsla(${circle.hue}, ${circle.saturation}%, ${circle.lightness}%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            requestAnimationFrame(drawBackground);
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawBackground();
        
        // Audio Quiz Implementation
        let quizData = null;
        let currentSentence = null;
        let allSentences = [];
        let audioElement = null;
        let correctOptionSelected = false;
        let isPlaying = false;
        let audioContext = null;
        let audioAnalyser = null;
        let audioDataArray = null;
        let animationFrame;
        
        // Waveform visualization
        const waveform = document.getElementById('waveform');
        const waveCtx = waveform.getContext('2d');
        const playIcon = document.getElementById('play-icon');
        
        function initWaveform() {
            waveform.width = 120;
            waveform.height = 120;
        }
        
        function drawWaveform() {
            if (!isPlaying || !audioDataArray) {
                cancelAnimationFrame(animationFrame);
                return;
            }
            
            waveCtx.clearRect(0, 0, waveform.width, waveform.height);
            
            // Get audio data
            audioAnalyser.getByteFrequencyData(audioDataArray);
            
            const barWidth = 3;
            const barGap = 2;
            const centerY = waveform.height / 2;
            const maxBarHeight = waveform.height * 0.5; // Slightly reduced height
            
            // Center the waveform in the button
            const barCount = Math.floor(waveform.width * 0.7 / (barWidth + barGap)); // Use 70% of width
            const totalWidth = barCount * (barWidth + barGap) - barGap;
            const startX = (waveform.width - totalWidth) / 2;
            
            // Draw waveform bars
            waveCtx.fillStyle = '#333';
            
            const step = Math.ceil(audioDataArray.length / barCount);
            
            for (let i = 0; i < barCount; i++) {
                const dataIndex = Math.min(i * step, audioDataArray.length - 1);
                const value = audioDataArray[dataIndex] / 256; // Normalize to 0-1
                const barHeight = value * maxBarHeight;
                
                const x = startX + i * (barWidth + barGap);
                
                // Draw symmetrical bars (top and bottom)
                waveCtx.fillRect(x, centerY - barHeight / 2, barWidth, barHeight);
            }
            
            // Continue animation loop
            animationFrame = requestAnimationFrame(drawWaveform);
        }
        
        // Parse URL parameter
        function getPageNameFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('page');
        }
        
        // Load CSV data
        async function loadCSVData() {
            const pageName = getPageNameFromUrl();
            if (!pageName) {
                showError("No page parameter specified in URL");
                return;
            }
            
            try {
                const response = await fetch(`/chfx/speechRecognition.csv`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                parseCSV(csvText, pageName);
            } catch (error) {
                showError(`Error loading CSV: ${error.message}`);
            }
        }
        
        // Simple CSV parser
        function parseCSV(text, targetName) {
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            const nameIndex = headers.indexOf('nameOfSite');
            const soundFileIndex = headers.indexOf('soundFile');
            const englishTranslationIndex = headers.indexOf('englishTranslation');
            
            if (nameIndex === -1 || soundFileIndex === -1 || englishTranslationIndex === -1) {
                showError("CSV file missing required columns");
                return;
            }
            
            let found = false;
            allSentences = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const values = lines[i].split(',').map(v => v.trim());
                const sentence = {
                    nameOfSite: values[nameIndex],
                    soundFile: values[soundFileIndex],
                    englishTranslation: values[englishTranslationIndex]
                };
                
                allSentences.push(sentence);
                
                if (sentence.nameOfSite === targetName) {
                    currentSentence = sentence;
                    found = true;
                }
            }
            
            if (!found) {
                showError(`No data found for page: ${targetName}`);
                return;
            }
            
            initQuiz();
        }
        
        function initQuiz() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            
            // Initialize audio context
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create audio element with explicit path
            audioElement = new Audio(`/audio/random/${currentSentence.soundFile}.mp3`);
            
            // Make sure audio is fully loaded before playing
            audioElement.load();
            
            // Events for audio element
            audioElement.addEventListener('ended', () => {
                isPlaying = false;
                playIcon.style.opacity = '1';
                waveform.style.opacity = '0';
                cancelAnimationFrame(animationFrame);
            });
            
            // Generate options
            generateOptions();
            
            // Set up waveform
            initWaveform();
            
            // Set up audio analyser when audio is loaded
            audioElement.addEventListener('canplaythrough', () => {
                setupAudioAnalyser();
            });
            
            // Play button click event
            document.getElementById('play-button').addEventListener('click', playAudio);
        }
        
        function setupAudioAnalyser() {
            // Only set up once
            if (audioAnalyser) return;
            
            const source = audioContext.createMediaElementSource(audioElement);
            audioAnalyser = audioContext.createAnalyser();
            audioAnalyser.fftSize = 64;
            source.connect(audioAnalyser);
            audioAnalyser.connect(audioContext.destination);
            
            audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
        }
        
        function playAudio() {
            if (isPlaying) {
                audioElement.pause();
                audioElement.currentTime = 0;
                isPlaying = false;
                playIcon.style.opacity = '1';
                waveform.style.opacity = '0';
                cancelAnimationFrame(animationFrame);
            } else {
                // Resume AudioContext if suspended (needed for Chrome's autoplay policy)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                audioElement.play().then(() => {
                    isPlaying = true;
                    playIcon.style.opacity = '0';
                    waveform.style.opacity = '1';
                    drawWaveform();
                }).catch(err => {
                    console.error("Error playing audio:", err);
                    alert("Could not play audio. Error: " + err.message);
                });
            }
        }
        
        function generateOptions() {
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            // Get the correct answer
            const correctAnswer = currentSentence.englishTranslation;
            
            // Find similar sentences for wrong options
            const wrongOptions = findSimilarSentences(correctAnswer, 3);
            
            // Combine and shuffle options
            const options = [correctAnswer, ...wrongOptions];
            shuffleArray(options);
            
            // Create option elements
            const letters = ['A', 'B', 'C', 'D'];
            options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = `<span class="option-letter">${letters[index]}</span><span class="option-text">${option}</span>`;
                
                optionElement.addEventListener('click', () => {
                    if (correctOptionSelected) return; // Prevent selecting after correct answer
                    
                    if (option === correctAnswer) {
                        // Correct answer
                        optionElement.style.backgroundColor = '#00D17A';
                        correctOptionSelected = true;
                        document.getElementById('feedback').textContent = 'Correct!';
                    } else {
                        // Wrong answer
                        optionElement.style.backgroundColor = '#EA0070';
                        setTimeout(() => {
                            if (!correctOptionSelected) {
                                optionElement.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                            }
                        }, 2000);
                    }
                });
                
                optionsContainer.appendChild(optionElement);
            });
        }
        
        function findSimilarSentences(correctSentence, count) {
            const basicPronouns = ['you', 'i', 'me', 'he', 'she', 'they', 'my', 'your', 'we', 'us', 'our'];
            const correctWords = correctSentence.toLowerCase().split(/\W+/).filter(w => w.length > 0);
            
            // Filter out basic pronouns from comparison
            const significantWords = correctWords.filter(w => !basicPronouns.includes(w.toLowerCase()));
            
            // Find sentences that share at least one significant word
            const similarSentences = allSentences
                .filter(s => s.englishTranslation !== correctSentence) // Exclude the correct sentence
                .filter(s => {
                    const sentenceWords = s.englishTranslation.toLowerCase().split(/\W+/).filter(w => w.length > 0);
                    return significantWords.some(word => 
                        sentenceWords.includes(word.toLowerCase())
                    );
                })
                .map(s => s.englishTranslation);
            
            // If not enough similar sentences, get random ones
            if (similarSentences.length < count) {
                const randomSentences = allSentences
                    .filter(s => s.englishTranslation !== correctSentence)
                    .filter(s => !similarSentences.includes(s.englishTranslation))
                    .map(s => s.englishTranslation);
                
                shuffleArray(randomSentences);
                
                return [
                    ...similarSentences,
                    ...randomSentences.slice(0, count - similarSentences.length)
                ];
            }
            
            // Shuffle and take the requested count
            shuffleArray(similarSentences);
            return similarSentences.slice(0, count);
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        function showError(message) {
            const loader = document.getElementById('loader');
            loader.textContent = `Error: ${message}`;
            loader.style.color = '#EA0070';
        }
        
        // Start the application
        document.addEventListener('DOMContentLoaded', () => {
            loadCSVData();
        });
    </script>
</body>
</html>
