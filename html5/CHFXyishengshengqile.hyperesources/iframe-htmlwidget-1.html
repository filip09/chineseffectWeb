<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive YouTube Shorts Widget</title>
    <style>
        body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .widget-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/V9S2w9_iNeI" 
            frameborder="0" 
            allowfullscreen
        ></iframe>
    </div>
</body>
</html>
