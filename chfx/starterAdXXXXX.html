<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chineseffect Smart System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #f0f0f0;
      --secondary-color: #ffffff;
      --accent-color: #e0e0e0;
      --bg-gradient-1: #121212;
      --bg-gradient-2: #1a1a1a;
      --bg-gradient-3: #222222;
      --bg-gradient-4: #2a2a2a;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --circle-color: rgba(0, 0, 0, 0.6);
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      touch-action: pan-y;
    }
    
    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .content-wrapper {
      min-height: 150vh; /* Increased for more scroll space */
      position: relative;
      padding-bottom: 20vh;
    }
    
    .dynamic-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(
        135deg,
        var(--bg-gradient-1) 0%,
        var(--bg-gradient-2) 35%,
        var(--bg-gradient-3) 65%,
        var(--bg-gradient-4) 100%
      );
      z-index: 0;
      transition: all 2s ease;
    }
    
    .ambient-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 70% 20%, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
      mix-blend-mode: overlay;
      transition: all 2s ease;
    }
    
    .circle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    
    .circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.6);
      background: transparent;
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.5s ease-out, border-color 2s ease;
    }
    
    .overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
    }
    
    .line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      max-width: 2000px;
      opacity: 0;
      filter: blur(16px);
      transition: opacity 1.5s ease, filter 1.8s ease, color 2s ease, text-shadow 2s ease;
      pointer-events: auto;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
    }
    
    .line.visible {
      opacity: 1;
      filter: blur(0);
    }
    
    .line1 {
      top: 15vh;
      font-weight: 900;
      color: var(--primary-color);
      letter-spacing: 0.03em;
      font-size: 12vw;
      text-shadow: 0 2px 16px var(--shadow-color);
    }
    
    .line1-part1, .line1-part2, .line1-part3 {
      font-weight: 900;
      color: var(--primary-color);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 16px var(--shadow-color);
      display: none;
    }
    
    .line2 {
      top: 50vh;
      transform: translate(-50%, -50%);
      font-size: 8vw;
      font-weight: 400;
      color: var(--secondary-color);
      text-shadow: 0 2px 16px var(--shadow-color);
      white-space: nowrap;
    }
    
    .line3 {
      bottom: 15vh;
      font-size: 10vw;
      font-weight: 700;
      color: var(--accent-color);
      text-shadow: 0 2px 16px var(--shadow-color);
    }
    
    .line3 a {
      color: inherit;
      text-decoration: underline;
      pointer-events: auto;
      transition: color 0.3s;
    }
    
    .line3 a:hover {
      color: #ffffff;
    }
    
    .letter {
      display: inline-block;
      animation: float 4s ease-in-out infinite alternate;
      animation-play-state: paused;
      will-change: transform;
    }
    
    .line.visible .letter {
      animation-play-state: running;
    }
    
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    
    @media (max-width: 600px) {
      .line1 {
        display: none;
      }
      .line1-part1, .line1-part2, .line1-part3 {
        display: block;
        font-size: 15vw;
        line-height: 1.0;
      }
      .line1-part1 {
        top: 8vh;
      }
      .line1-part2 {
        top: 18vh;
      }
      .line1-part3 {
        top: 28vh;
      }
      .line2 {
        font-size: 10vw;
        font-weight: 400;
        top: 50vh;
        width: 95%;
        white-space: nowrap;
      }
      .line3 {
        font-size: 14vw;
        font-weight: 700;
        bottom: 12vh;
        top: auto;
      }
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <div class="dynamic-background" id="dynamic-background"></div>
    <div class="ambient-light"></div>
    <div class="circle-container" id="circle-container"></div>
    <div class="overlay">
      <div class="line line1" id="line1"></div>
      <div class="line line1-part1" id="line1-part1"></div>
      <div class="line line1-part2" id="line1-part2"></div>
      <div class="line line1-part3" id="line1-part3"></div>
      <div class="line line2" id="line2"></div>
      <div class="line line3" id="line3">
        <a href="https://chineseffect.com/starterkit-2/" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
  
  <script>
    const TEXTS = [
      "CHINESEFFECT SMART SYSTEM",
      "Your Fastest Path To Confidence",
      "LIMITED SPECIAL OFFER"
    ];
    
    const COLOR_PALETTES = [
      {
        primary: "#f8fafc",
        secondary: "#ffffff",
        accent: "#e2e8f0",
        bg1: "#0f172a",
        bg2: "#1e293b",
        bg3: "#334155",
        bg4: "#475569"
      },
      {
        primary: "#faf5ff",
        secondary: "#ffffff",
        accent: "#e9d5ff",
        bg1: "#1e1b4b",
        bg2: "#312e81",
        bg3: "#3730a3",
        bg4: "#4338ca"
      },
      {
        primary: "#f0fdf4",
        secondary: "#ffffff",
        accent: "#dcfce7",
        bg1: "#14532d",
        bg2: "#166534",
        bg3: "#15803d",
        bg4: "#16a34a"
      },
      {
        primary: "#fefbf3",
        secondary: "#ffffff",
        accent: "#fed7aa",
        bg1: "#431407",
        bg2: "#92400e",
        bg3: "#b45309",
        bg4: "#d97706"
      },
      {
        primary: "#fef2f2",
        secondary: "#ffffff",
        accent: "#fee2e2",
        bg1: "#450a0a",
        bg2: "#7f1d1d",
        bg3: "#991b1b",
        bg4: "#b91c1c"
      },
      {
        primary: "#f0fdfa",
        secondary: "#ffffff",
        accent: "#ccfbf1",
        bg1: "#134e4a",
        bg2: "#115e59",
        bg3: "#0f766e",
        bg4: "#0d9488"
      },
      {
        primary: "#f8fafc",
        secondary: "#ffffff",
        accent: "#e2e8f0",
        bg1: "#0f172a",
        bg2: "#1e293b",
        bg3: "#334155",
        bg4: "#475569"
      },
      {
        primary: "#faf5ff",
        secondary: "#ffffff",
        accent: "#e0e7ff",
        bg1: "#1e1b4b",
        bg2: "#312e81",
        bg3: "#3730a3",
        bg4: "#4f46e5"
      }
    ];
    
    function getLine1Text() {
      if (window.innerWidth <= 600) {
        return ["CHINESEFFECT", "SMART", "SYSTEM"];
      }
      return [TEXTS[0]];
    }
    
    function setLineText(el, txt) {
      el.textContent = "";
      for (let i = 0; i < txt.length; i++) {
        const ch = txt[i];
        if (ch === " ") {
          el.appendChild(document.createTextNode(" "));
        } else if (ch === "\n") {
          el.appendChild(document.createElement("br"));
        } else {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = ch;
          span.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
          el.appendChild(span);
        }
      }
    }
    
    function calculateOptimalFontSize(text) {
      if (window.innerWidth > 600) return null;
      
      const testEl = document.createElement('div');
      testEl.style.position = 'absolute';
      testEl.style.visibility = 'hidden';
      testEl.style.whiteSpace = 'nowrap';
      testEl.style.fontWeight = '900';
      testEl.style.fontFamily = 'Lato, sans-serif';
      document.body.appendChild(testEl);
      
      const screenWidth = window.innerWidth;
      const maxWidth = screenWidth * 0.95;
      
      let fontSize = screenWidth * 0.15;
      testEl.style.fontSize = fontSize + 'px';
      testEl.textContent = text;
      
      while (testEl.offsetWidth > maxWidth && fontSize > 20) {
        fontSize -= 2;
        testEl.style.fontSize = fontSize + 'px';
      }
      
      document.body.removeChild(testEl);
      
      return (fontSize / screenWidth) * 100;
    }
    
    function fitTextToWidth(el, maxFont, minFont) {
      let fontSize = maxFont;
      el.style.fontSize = fontSize + 'vw';
      let parent = el.parentElement;
      let maxWidth = parent.offsetWidth * 0.98;
      
      el.style.whiteSpace = 'nowrap';
      
      while (el.scrollWidth > maxWidth && fontSize > minFont) {
        fontSize -= 0.5;
        el.style.fontSize = fontSize + 'vw';
      }
      
      if (window.innerWidth <= 600 && el.id === 'line3') {
        el.style.whiteSpace = 'pre-line';
      }
    }
    
    function renderLines() {
      const line1Texts = getLine1Text();
      if (window.innerWidth <= 600) {
        setLineText(document.getElementById('line1-part1'), line1Texts[0]);
        setLineText(document.getElementById('line1-part2'), line1Texts[1]);
        setLineText(document.getElementById('line1-part3'), line1Texts[2]);
        const optimalSize = calculateOptimalFontSize("CHINESEFFECT");
        if (optimalSize) {
          document.getElementById('line1-part1').style.fontSize = optimalSize + 'vw';
          document.getElementById('line1-part2').style.fontSize = optimalSize + 'vw';
          document.getElementById('line1-part3').style.fontSize = optimalSize + 'vw';
        }
      } else {
        setLineText(document.getElementById('line1'), line1Texts[0]);
        fitTextToWidth(document.getElementById('line1'), 12, 3);
      }
      
      setLineText(document.getElementById('line2'), TEXTS[1]);
      const line3 = document.querySelector('#line3 a');
      setLineText(line3, TEXTS[2]);
      
      if (window.innerWidth > 600) {
        fitTextToWidth(document.getElementById('line2'), 8, 3);
        fitTextToWidth(document.getElementById('line3'), 10, 3);
      } else {
        fitTextToWidth(document.getElementById('line2'), 10, 3);
        fitTextToWidth(document.getElementById('line3'), 14, 3);
      }
    }
    
    function updateColors() {
      const cycleTime = 45000;
      const timeProgress = (Date.now() % cycleTime) / cycleTime;
      const totalPalettes = COLOR_PALETTES.length;
      const exactIndex = timeProgress * totalPalettes;
      const currentIndex = Math.floor(exactIndex) % totalPalettes;
      const nextIndex = (currentIndex + 1) % totalPalettes;
      const factor = exactIndex - Math.floor(exactIndex);
      const smoothFactor = 0.5 - 0.5 * Math.cos(factor * Math.PI);
      
      const currentPalette = COLOR_PALETTES[currentIndex];
      const nextPalette = COLOR_PALETTES[nextIndex];
      
      function interpolateColor(color1, color2, factor) {
        const r1 = parseInt(color1.substring(1, 3), 16);
        const g1 = parseInt(color1.substring(3, 5), 16);
        const b1 = parseInt(color1.substring(5, 7), 16);
        const r2 = parseInt(color2.substring(1, 3), 16);
        const g2 = parseInt(color2.substring(3, 5), 16);
        const b2 = parseInt(color2.substring(5, 7), 16);
        const r = Math.round(r1 + factor * (r2 - r1));
        const g = Math.round(g1 + factor * (g2 - g1));
        const b = Math.round(b1 + factor * (b2 - b1));
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }
      
      document.documentElement.style.setProperty('--primary-color', 
        interpolateColor(currentPalette.primary, nextPalette.primary, smoothFactor));
      document.documentElement.style.setProperty('--secondary-color', 
        interpolateColor(currentPalette.secondary, nextPalette.secondary, smoothFactor));
      document.documentElement.style.setProperty('--accent-color', 
        interpolateColor(currentPalette.accent, nextPalette.accent, smoothFactor));
      document.documentElement.style.setProperty('--bg-gradient-1', 
        interpolateColor(currentPalette.bg1, nextPalette.bg1, smoothFactor));
      document.documentElement.style.setProperty('--bg-gradient-2', 
        interpolateColor(currentPalette.bg2, nextPalette.bg2, smoothFactor));
      document.documentElement.style.setProperty('--bg-gradient-3', 
        interpolateColor(currentPalette.bg3, nextPalette.bg3, smoothFactor));
      document.documentElement.style.setProperty('--bg-gradient-4', 
        interpolateColor(currentPalette.bg4, nextPalette.bg4, smoothFactor));
      document.documentElement.style.setProperty('--shadow-color', 'rgba(0, 0, 0, 0.6)');
      
      const lightEl = document.querySelector('.ambient-light');
      const lightX = 30 + 40 * Math.sin(timeProgress * Math.PI * 2);
      const lightY = 20 + 30 * Math.cos(timeProgress * Math.PI * 1.5);
      lightEl.style.background = `radial-gradient(circle at ${lightX}% ${lightY}%, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%)`;
    }
    
    function createFloatingCircles() {
      const container = document.getElementById('circle-container');
      const numCircles = 200;
      container.innerHTML = '';
      
      for (let i = 0; i < numCircles; i++) {
        const circle = document.createElement('div');
        circle.className = 'circle';
        const size = 8 + Math.random() * 60;
        circle.style.width = `${size}px`;
        circle.style.height = `${size}px`;
        const x = Math.random() * 100;
        const y = -30 + Math.random() * 160;
        circle.style.left = `${x}vw`;
        circle.style.top = `${y}vh`;
        const opacity = 0.2 + Math.random() * 0.4;
        circle.style.borderColor = `rgba(0, 0, 0, ${opacity})`;
        const borderWidth = 1 + Math.random();
        circle.style.borderWidth = `${borderWidth}px`;
        circle.dataset.originalX = x;
        circle.dataset.originalY = y;
        circle.dataset.speed = 0.05 + Math.random() * 0.15;
        circle.dataset.radius = 3 + Math.random() * 8;
        circle.dataset.phase = Math.random() * Math.PI * 2;
        container.appendChild(circle);
      }
    }
    
    function animateCircles(scrollProgress) {
      const circles = document.querySelectorAll('.circle');
      const now = Date.now() / 1000;
      circles.forEach(circle => {
        const originalX = parseFloat(circle.dataset.originalX);
        const originalY = parseFloat(circle.dataset.originalY);
        const speed = parseFloat(circle.dataset.speed);
        const radius = parseFloat(circle.dataset.radius);
        const phase = parseFloat(circle.dataset.phase);
        const time = now * speed;
        const dx = Math.cos(time + phase) * radius;
        const dy = Math.sin(time + phase) * radius;
        const scrollOffset = scrollProgress * 150;
        let newY = originalY + dy - scrollOffset;
        const wrapRange = 190;
        if (newY < -60) {
          newY += wrapRange;
        } else if (newY > 130) {
          newY -= wrapRange;
        }
        circle.style.transform = `translate(${dx}px, ${(newY - originalY)}vh)`;
      });
    }
    
    const lines = [
      {el: document.getElementById('line1'), threshold: 0.1},
      {el: document.getElementById('line1-part1'), threshold: 0.1},
      {el: document.getElementById('line1-part2'), threshold: 0.1},
      {el: document.getElementById('line1-part3'), threshold: 0.1},
      {el: document.getElementById('line2'), threshold: 0.3},
      {el: document.getElementById('line3'), threshold: 0.5}
    ];
    
    function onScroll() {
      const scrollY = window.scrollY;
      const vh = window.innerHeight;
      const maxScroll = vh * 1.7; // Adjusted for min-height and padding
      const scrollProgress = Math.min(scrollY / maxScroll, 1);
      
      animateCircles(scrollProgress);
      
      lines.forEach(({el, threshold}) => {
        if (scrollY >= vh * threshold) {
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      });
    }
    
    function animate() {
      updateColors();
      const scrollY = window.scrollY;
      const vh = window.innerHeight;
      const maxScroll = vh * 1.7;
      const scrollProgress = Math.min(scrollY / maxScroll, 1);
      animateCircles(scrollProgress);
      requestAnimationFrame(animate);
    }
    
    window.addEventListener('scroll', onScroll, {passive: true});
    window.addEventListener('resize', () => {
      renderLines();
      createFloatingCircles();
      onScroll();
    });
    
    renderLines();
    createFloatingCircles();
    onScroll();
    animate();
  </script>
</body>
</html>
