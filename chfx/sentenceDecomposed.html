<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Decomposed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; overflow: hidden; }
    .container { 
    display: flex; 
    justify-content: center; 
    align-items: flex-start;
    height: 100vh; 
    padding: 5px 5px;
    position: relative;
    }
    .content-area { 
    width: 100vw; 
    max-width: 100vw; 
    height: 100vh; 
    max-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    overflow: hidden; 
    opacity: 0; 
    transition: opacity 1s ease; 
    padding-top: 40px; /* Added padding at the top */
    }
    #words-container { 
    width: 100%; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    max-height: calc(100vh - 40px); /* Adjusted for top padding */
    overflow: hidden; 
    padding-bottom: 80px; /* Added padding at the bottom */
    position: relative;
    /* Changed from center to flex-start for vertical alignment */
    justify-content: flex-start;
    height: 100%;
    }
    .word-row { 
    display: flex; 
    align-items: stretch;
    width: 100%; 
    max-width: 800px;
    position: relative; 
    height: var(--image-max-height, 150px);
    min-height: var(--image-max-height, 150px);
    margin-bottom: var(--row-gap, 0px); 
    opacity: 0; 
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.4,2,.6,1); 
    border-radius: 10px; 
    overflow: visible; 
    }
    .word-image-container { 
    flex-shrink: 0; 
    width: auto; 
    margin-right: 20px;
    display: flex; 
    align-items: center; 
    justify-content: flex-start; 
    position: relative;
    height: 100%;
    }
    .word-image { 
    height: 100%;
    width: auto;
    display: block; 
    object-fit: contain; 
    max-height: 100%;
    max-width: 100%; 
    }
    .character-image { 
    height: 100%;
    width: auto; 
    display: inline-block; 
    vertical-align: middle; 
    margin-right: calc(var(--image-max-height, 150px) * 0.11); 
    cursor: pointer; 
    transition: transform 0.2s ease, all 0.5s cubic-bezier(.4,2,.6,1); 
    }
    .character-image:hover { transform: scale(1.08); }
    .word-image:hover { transform: scale(1.08); }
    .character-fallback:hover { transform: scale(1.08); }
    .character-container:hover { transform: scale(1.08); }
    .word-image { 
    transition: transform 0.2s ease;
    }
    .character-image:last-child { margin-right: 0; }
    .character-fallback { 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    font-size: calc(var(--image-max-height, 150px) * 0.6); 
    height: 100%;
    min-width: var(--image-max-height, 150px);
    background: rgba(255, 255, 255, 0.8); 
    color: #333; 
    border-radius: 8px; 
    margin: 0;
    cursor: pointer;
    transition: transform 0.2s ease;
    }
    .character-container {
    display: inline-block; /* Ensure it wraps the images */
    cursor: pointer;
    height: 100%;
    transition: transform 0.2s ease;
    }
    .character-container img {
    margin-right: calc(var(--image-max-height, 150px) * 0.11);
    }
    .character-container img:last-child {
    margin-right: 0;
    }
    .word-info { 
    display: flex; 
    flex-direction: column; 
    flex-grow: 1; 
    padding-left: 20px;
    overflow: hidden;
    justify-content: space-between;
    height: 100%; 
    transition: opacity 0.5s ease; 
    }
    .pinyin, .meaning { 
    position: relative; 
    display: inline-block; 
    padding: 4px 8px;
    background: rgba(255, 255, 255, 0.15); 
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 6px;
    max-width: 100%;
    box-sizing: border-box;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
    color: #fff;
    }
    .pinyin { 
    font-weight: 400; 
    opacity: 0; 
    transition: opacity 1s ease; 
    }
    .meaning { 
    font-weight: 600; 
    opacity: 0; 
    transition: opacity 1s ease; 
    }
    #audio-player { display: none; }
    .word-row { 
    position: relative; 
    margin-bottom: var(--row-gap, 15px);
    height: auto; 
    min-height: var(--row-min-height, auto); 
    padding-bottom: 0; 
    max-width: 800px;
    }
    .word-image-container { 
    position: absolute; 
    left: 0; 
    top: 0; 
    width: auto; 
    height: 100%; 
    margin-right: 0; 
    display: flex; 
    align-items: center; 
    z-index: 5; 
    }
    .word-info { 
    width: auto; 
    padding-left: 120px;
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    height: 100%; 
    }
    /* --- TRANSLATION ROW CHANGES --- */
   .translation-row { 
    margin-top: calc(var(--image-max-height, 150px) * 0.11);
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 8px; 
    padding: 8px 12px; /* Reduced from 15px to 8px (top/bottom) */
    width: 100%; 
    max-width: 800px;
    display: flex; 
    align-items: center; 
    justify-content: flex-start; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
}
    .translation-info {
    display: flex;
    align-items: center;
    height: 100%;
    flex: 1;
    padding-left: 0;
    }
    .translation-text { 
    font-size: 22px;
    font-weight: 600; 
    color: rgba(255,255,255,0.92); 
    text-align: center; 
    opacity: 0; 
    transition: opacity 1s ease; 
    letter-spacing: 0.5px; 
    flex: 1; 
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    }
    .audio-icon {
    width: 50px;
    height: 50px;
    margin-right: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    box-sizing: border-box;
    transition: background 0.2s, border 0.2s;
    }
    .audio-icon:focus { outline: 2px solid #93C5FD; }
    .audio-icon:hover { background: none; border: none; }
    .word-row.fading { opacity: 0 !important; pointer-events: none; }
    .word-row.transitioning { z-index: 10; }
    .word-row.fadeout { transition: opacity 0.5s; opacity: 0 !important; }
    .character-image.enlarged, .word-image.enlarged, .character-fallback.enlarged, .character-container.enlarged {
    z-index: 100;
    position: fixed !important;
    pointer-events: none;
    will-change: transform, opacity;
    }
    .character-image.fadeout, .word-image.fadeout, .character-fallback.fadeout, .character-container.fadeout {
    opacity: 0 !important;
    transition: opacity 0.5s ease;
    }
    .info-hidden { opacity: 0 !important; }
    @media (max-width: 768px) {
    .pinyin, .meaning { font-size: 20px; padding: 4px 8px; }
    .word-row, .translation-row { max-width: 100%; }
    .translation-text { font-size: 18px; }
    .translation-row { margin-top: calc(var(--image-max-height, 150px) * 0.11); }
    .content-area { padding-top: 30px; } /* Adjusted for smaller screens */
    #words-container { padding-bottom: 60px; } /* Adjusted for smaller screens */
    }
    @media (max-width: 480px) {
    .pinyin, .meaning { font-size: 16px; padding: 3px 6px; }
    #words-container { gap: 0 !important; padding-top: var(--container-padding, 5px); padding-bottom: 40px; }
    .word-row:last-child { margin-bottom: 0; }
    .translation-text { font-size: 14px; }
    .translation-row { margin-top: calc(var(--image-max-height, 150px) * 0.11); }
    .audio-icon { width: 40px; height: 40px; margin-right: 10px; }
    .content-area { padding-top: 20px; } /* Adjusted for mobile */
    }
    </style>
</head>
<body>
    <div class="container">
    <div class="content-area">
    <div id="words-container"></div>
    </div>
    </div>
    <audio id="audio-player"></audio>
    <script>
    // ── Pre-load injection: miniSentence.html fetches CSVs in parallel and
    //    passes them here via postMessage, skipping all network requests. ────────
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'chfxPreloadData') return;
        sentencesDataCache        = e.data.sentencesData;
        wordsDataCache            = e.data.wordsData;
        charactersDataCache       = e.data.charactersData;
        speechRecognitionCache    = e.data.speechRecognitionData;
    });
    // Signal to parent that this script is running and ready to receive data
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'chfxIframeReady' }, '*');
    }
    // ─────────────────────────────────────────────────────────────────────────────

    // Background is handled by the chfxBackground.html iframe — no canvas JS needed.

    // --- CSV helpers ---
    async function fetchCSV(url) {
    const response = await fetch(url);
    const text = await response.text();
    return parseCSV(text);
    }
    
    function parseCSV(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    if (!lines.length) return [];
    function parseLine(line) {
        const result = []; let cur = ''; let inQ = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else { inQ = !inQ; } }
            else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
            else { cur += ch; }
        }
        result.push(cur.trim());
        return result;
    }
    const headers = parseLine(lines[0]);
    const result = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseLine(lines[i]);
        const entry = {};
        for (let j = 0; j < headers.length; j++) { entry[headers[j]] = values[j] || ''; }
        result.push(entry);
    }
    return result;
    }
    
    function imageExists(url) {
    return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
    });
    }


    // --- Dynamic font sizing: shrinks text only if it overflows, layout/images untouched ---
    function applyDynamicFontSize(el, baseFontSize) {
        const minFontSize = 9;
        el.style.fontSize = baseFontSize + 'px';
        // After paint, shrink until it fits
        requestAnimationFrame(() => {
            let size = baseFontSize;
            while (el.scrollWidth > el.offsetWidth + 1 && size > minFontSize) {
                size -= 0.5;
                el.style.fontSize = size + 'px';
            }
        });
    }

    // --- Main rendering (modified for larger elements) ---
    function calculateOptimalFontSize() {
    const container = document.querySelector('.content-area');
    const containerWidth = container.clientWidth;
    let fontSize = 24;
    if (containerWidth < 480) fontSize = 16;
    else if (containerWidth < 768) fontSize = 20;
    else if (containerWidth < 1024) fontSize = 22;
    document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
    return fontSize;
    }
    
    function calculateOptimalLayout(contentHeight, totalWords) {
    const isMobile = window.innerWidth <= 480;
    const isTablet = window.innerWidth <= 768 && window.innerWidth > 480;
    let uniformImageHeight, uniformRowGap;
    // Adjusted to account for top and bottom padding
    const availableHeight = contentHeight * 0.9 - 120; // Subtract padding
    
    if (isMobile) {
    uniformImageHeight = Math.min(90, availableHeight / (totalWords * 1.3));
    uniformRowGap = (availableHeight - (uniformImageHeight * totalWords)) / (totalWords + 1);
    } else if (isTablet) {
    uniformImageHeight = Math.min(120, availableHeight / (totalWords * 1.2));
    uniformRowGap = (availableHeight - (uniformImageHeight * totalWords)) / (totalWords + 1);
    } else {
    uniformImageHeight = Math.min(150, availableHeight / (totalWords * 1.1));
    uniformRowGap = (availableHeight - (uniformImageHeight * totalWords)) / (totalWords + 2);
    }
    uniformRowGap = Math.max(uniformRowGap, 10);
    return { uniformImageHeight, uniformRowGap };
    }
    
    function animateElementsSequentially(elements, delayBetween = 150) {
    elements.forEach((el, index) => {
    setTimeout(() => { el.style.opacity = '1'; }, index * delayBetween);
    });
    }

    // --- Sentence transition logic (unchanged) ---
    let sentencesDataCache = null;
    let wordsDataCache = null;
    let charactersDataCache = null;
    let speechRecognitionCache = null;
    let currentSentenceCode = null;
    let audioPlayer = null;
    let audioUrl = null;
    
    // Store visited sentences for each word to ensure cycling through all sentences
    const visitedSentences = {};

    async function getSentencesData() {
    if (!sentencesDataCache)
    sentencesDataCache = await fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=1786045565');
    return sentencesDataCache;
    }
    
    async function getWordsData() {
    if (!wordsDataCache)
    wordsDataCache = await fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=1317258846');
    return wordsDataCache;
    }
    
    async function getCharactersData() {
    if (!charactersDataCache)
    charactersDataCache = await fetchCSV('https://docs.google.com/spreadsheets/d/16grIngNs6Hs3zKq2V_Um13zXYVEeSH2TyelYLSZltIs/export?format=csv&gid=2127647417').catch(() => []);
    return charactersDataCache;
    }
    
    async function getSpeechRecognitionData() {
    if (!speechRecognitionCache)
    speechRecognitionCache = await fetchCSV('https://chineseffect.com/chfx/speechRecognition.csv');
    return speechRecognitionCache;
    }
    
   async function findOtherSentenceWithWord(wordCode, excludeSentenceCode) {
    const sentencesData = await getSentencesData();
    // Find all sentences with the word (case-insensitive, trimmed)
    const allSentencesWithWord = sentencesData.filter(s =>
        Object.keys(s).some(key =>
            key.startsWith('word') &&
            (s[key] || '').trim().toLowerCase() === wordCode.trim().toLowerCase()
        )
    ).map(s => s.sentenceCode);

    if (allSentencesWithWord.length <= 1) return null;

    // Initialize or update visited list for this word
    if (!visitedSentences[wordCode]) {
        visitedSentences[wordCode] = {
            visited: [excludeSentenceCode],
            allSentences: allSentencesWithWord
        };
    }
    const wordVisitData = visitedSentences[wordCode];

    // Remove any visited sentences that are no longer in the list
    wordVisitData.visited = wordVisitData.visited.filter(code => allSentencesWithWord.includes(code));

    // If all have been visited, reset (except current)
    if (wordVisitData.visited.length >= allSentencesWithWord.length) {
        wordVisitData.visited = [excludeSentenceCode];
    } else if (!wordVisitData.visited.includes(excludeSentenceCode)) {
        wordVisitData.visited.push(excludeSentenceCode);
    }

    // Find unvisited sentences
    const unvisitedSentences = allSentencesWithWord.filter(
        sentenceCode => !wordVisitData.visited.includes(sentenceCode)
    );

    if (unvisitedSentences.length === 0) {
        // Should not happen, but just in case, reset and try again
        wordVisitData.visited = [excludeSentenceCode];
        return findOtherSentenceWithWord(wordCode, excludeSentenceCode);
    }

    // Pick a random unvisited sentence
    const nextSentence = unvisitedSentences[Math.floor(Math.random() * unvisitedSentences.length)];
    wordVisitData.visited.push(nextSentence);

    return nextSentence;
}

    // --- Main init ---
    async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const sentenceCode = urlParams.get('page');
    currentSentenceCode = sentenceCode;
    if (!sentenceCode) {
    document.getElementById('words-container').innerHTML = '<p>No sentence code provided.</p>';
    return;
    }
    try {
    // Load all necessary data
    const [sentencesData, wordsData, charactersData, speechRecognitionData] = await Promise.all([
    getSentencesData(), getWordsData(), getCharactersData(), getSpeechRecognitionData()
    ]);
    // Create a map for quick character lookup
    const charactersMap = {};
    for (const entry of charactersData) {
    if (entry.chineseCharacter) charactersMap[entry.chineseCharacter] = entry;
    }
    const currentSentence = sentencesData.find(s => s.sentenceCode === sentenceCode);
    if (!currentSentence) {
    document.getElementById('words-container').innerHTML = '<p>Sentence not found.</p>';
    return;
    }
    // Audio
    audioPlayer = document.getElementById('audio-player');
    audioUrl = `https://chineseffect.com/audio/random/${currentSentence.sentenceAudio}.mp3`;
    audioPlayer.src = audioUrl;

    // Prepare container
    const wordsContainer = document.getElementById('words-container');
    wordsContainer.innerHTML = '';
    // Get word data for all words in the sentence
    const wordKeys = Object.keys(currentSentence).filter(key => key.startsWith('word') && currentSentence[key]);
    const fontSize = calculateOptimalFontSize();
    const wordDataPromises = [];
    for (const wordKey of wordKeys) {
    const wordCode = currentSentence[wordKey];
    const wordData = wordsData.find(w => w.nameOfSite === wordCode);
    if (wordData) {
    wordDataPromises.push({ wordKey, wordCode, wordData });
    }
    }
    wordDataPromises.sort((a, b) => parseInt(a.wordKey.replace('word', '')) - parseInt(b.wordKey.replace('word', '')));
    const contentHeight = window.innerHeight * 0.85;
    const totalWords = wordDataPromises.length;
    const { uniformImageHeight, uniformRowGap } = calculateOptimalLayout(contentHeight, totalWords);
    document.documentElement.style.setProperty('--row-height', `${uniformImageHeight}px`);
    document.documentElement.style.setProperty('--row-min-height', `${uniformImageHeight}px`);
    document.documentElement.style.setProperty('--row-gap', `${uniformRowGap}px`);
    document.documentElement.style.setProperty('--container-padding', `${uniformRowGap}px`);
    document.documentElement.style.setProperty('--image-max-height', `${uniformImageHeight}px`);
    wordsContainer.style.paddingBottom = `${uniformRowGap * 1.2}px`;
    const elementsToAnimate = [];
    // --- Render word rows ---
    for (const { wordCode, wordData } of wordDataPromises) {
    const wordRow = document.createElement('div');
    wordRow.className = 'word-row';
    wordRow.style.marginBottom = `${uniformRowGap}px`;
    wordRow.style.minHeight = `${uniformImageHeight}px`;
    const wordImageContainer = document.createElement('div');
    wordImageContainer.className = 'word-image-container';
    // Render word visual
    const { element: wordVisual, isWordImage } = await renderWordVisual(wordCode, wordData, charactersMap, uniformImageHeight, wordRow, wordCode);
    wordImageContainer.appendChild(wordVisual);
    const wordInfo = document.createElement('div');
    wordInfo.className = 'word-info';
    const pinyin = document.createElement('div');
    pinyin.className = 'pinyin';
    pinyin.textContent = wordData.pinyin || '';
    pinyin.style.fontSize = `${fontSize}px`;
    const meaning = document.createElement('div');
    meaning.className = 'meaning';
    meaning.textContent = wordData.meaning || '';
    meaning.style.fontSize = `${fontSize}px`;
    wordInfo.appendChild(pinyin);
    wordInfo.appendChild(meaning);
    wordRow.appendChild(wordImageContainer);
    wordRow.appendChild(wordInfo);
    wordsContainer.appendChild(wordRow);
    elementsToAnimate.push(wordRow, pinyin, meaning);
    // Apply dynamic font sizing after layout settles
    applyDynamicFontSize(pinyin, fontSize);
    applyDynamicFontSize(meaning, fontSize);
    // Adjust padding based on visual width
    if (isWordImage && wordVisual instanceof HTMLImageElement) {
    wordVisual.onload = function() {
    const imgWidth = this.width || 120;
    const paddingLeft = imgWidth + 20;
    wordInfo.style.paddingLeft = `${paddingLeft}px`;
    };
    } else {
    setTimeout(() => {
    const containerWidth = wordImageContainer.offsetWidth || 120;
    const paddingLeft = containerWidth + 20;
    wordInfo.style.paddingLeft = `${paddingLeft}px`;
    }, 0);
    }
    }
    if (wordsContainer.lastChild) wordsContainer.lastChild.style.marginBottom = '0';
    wordsContainer.style.overflowY = 'hidden';

    // --- Add English translation row with audio icon ---
    const speechRow = speechRecognitionData.find(row => row.nameOfSite === sentenceCode);
    if (speechRow && speechRow.englishTranslation) {
    const translationRow = document.createElement('div');
    translationRow.className = 'word-row translation-row';
    
    // Create audio icon with synth wave animation
    const audioIcon = document.createElement('div');
    audioIcon.className = 'audio-icon';
    audioIcon.id = 'audio-icon';
    audioIcon.setAttribute('aria-label', 'Play audio');
    audioIcon.setAttribute('tabindex', '0');
    audioIcon.innerHTML = `
    <svg id="synth-wave" width="40" height="40" viewBox="0 0 32 32">
    <rect x="4"  y="14" width="4" height="12" rx="2" fill="#93C5FD"/>
    <rect x="12" y="10" width="4" height="16" rx="2" fill="#93C5FD"/>
    <rect x="20" y="6"  width="4" height="24" rx="2" fill="#93C5FD"/>
    <rect x="28" y="10" width="4" height="16" rx="2" fill="#93C5FD"/>
    </svg>
    `;
    
    audioIcon.addEventListener('click', function(e) {
    e.stopPropagation();
    playAudio();
    });
    
    const translationInfo = document.createElement('div');
    translationInfo.className = 'word-info translation-info';
    translationInfo.style.paddingLeft = '0';
    const translationText = document.createElement('div');
    translationText.className = 'translation-text';
    translationText.textContent = speechRow.englishTranslation;
    translationInfo.appendChild(translationText);
    translationRow.appendChild(audioIcon);
    translationRow.appendChild(translationInfo);
    wordsContainer.appendChild(translationRow);
    elementsToAnimate.push(translationRow, translationText);
    // Apply dynamic font sizing to translation
    const translationBaseFontSize = window.innerWidth <= 480 ? 14 : window.innerWidth <= 768 ? 18 : 22;
    applyDynamicFontSize(translationText, translationBaseFontSize);
    }

    // Fade in the content area
    const contentArea = document.querySelector('.content-area');
    setTimeout(() => {
    contentArea.style.opacity = '1';
    // Notify parent that content is now visible
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'chfxContentReady' }, '*');
    }
    }, 100);

    // Then animate the elements sequentially
    animateElementsSequentially(elementsToAnimate, 150);

    } catch (error) {
    document.getElementById('words-container').innerHTML = `<p>Error loading data: ${error.message}</p>`;
    }
    }

    // --- Render word visual with click handler for transition ---
    async function renderWordVisual(wordCode, wordData, charactersMap, uniformImageHeight, wordRow, wordCodeForTransition) {
    console.log('Rendering word visual for:', wordCode);
    
    let visualElement = null;
    let isWordImage = false;

    // 1. Try word image first
    const wordImageUrl = `https://chineseffect.com/images/wordsTiles/${wordCode}.webp`;
    if (await imageExists(wordImageUrl)) {
        const img = document.createElement('img');
        img.src = wordImageUrl;
        img.alt = wordData.pinyin || wordCode;
        img.className = 'word-image';
        img.style.height = `${uniformImageHeight}px`;
        img.style.maxHeight = `${uniformImageHeight}px`;
        img.style.width = 'auto';
        visualElement = img;
        isWordImage = true;
    }

    // 2. If no word image, try character images
    if (!visualElement && charactersMap && wordData.characters) {
        const container = document.createElement('div');
        container.className = 'character-container';
        
        let allCharsHaveImages = true;
        const chars = wordData.characters.split('');

        for (const char of chars) {
            const charEntry = charactersMap[char];
            if (charEntry) {
                const charImgUrl = `https://chineseffect.com/images/characters/${charEntry.visualFile}.webp`;
                if (await imageExists(charImgUrl)) {
                    const img = document.createElement('img');
                    img.src = charImgUrl;
                    img.alt = char;
                    img.className = 'character-image';
                    img.style.height = `${uniformImageHeight}px`;
                    container.appendChild(img);
                } else {
                    allCharsHaveImages = false;
                    break;
                }
            } else {
                allCharsHaveImages = false;
                break;
            }
        }

        if (allCharsHaveImages && container.childNodes.length > 0) {
            visualElement = container;
            isWordImage = false;
        }
    }

    // 3. If no word image and no character images, use fallback text
    if (!visualElement) {
        const fallback = document.createElement('div');
        fallback.className = 'character-fallback';
        fallback.textContent = wordData.characters || wordCode;
        fallback.style.height = `${uniformImageHeight}px`;
        visualElement = fallback;
        isWordImage = false;
    }

    // 4. Attach click handler to the visual element
    visualElement.addEventListener('click', async (e) => {
        e.stopPropagation();
        console.log('Visual element clicked:', wordCodeForTransition);
        await handleCharacterClick(wordCodeForTransition, wordRow, visualElement);
    });

    return { element: visualElement, isWordImage: isWordImage };
    }

    // --- Handle character click and transition ---
    async function handleCharacterClick(charOrWordCode, wordRow, imgElement) {
    console.log('Click handler received:', charOrWordCode);
    
    // Find another sentence with this character/word
    const nextSentenceCode = await findOtherSentenceWithWord(charOrWordCode, currentSentenceCode);
    if (!nextSentenceCode) {
        console.log('No next sentence found for:', charOrWordCode);
        return;
    }
    
    console.log('Found next sentence:', nextSentenceCode);
    
    // Immediately hide the info text in the same row
    const infoElement = wordRow.querySelector('.word-info');
    if (infoElement) infoElement.classList.add('info-hidden');
    
    // Animate: fade out all except clicked row
    const allRows = Array.from(document.querySelectorAll('.word-row'));
    allRows.forEach(row => { if (row !== wordRow) row.classList.add('fading'); });
    
    // Make sure the image container is not constrained
    const imageContainer = wordRow.querySelector('.word-image-container');
    if (imageContainer) imageContainer.style.overflow = 'visible';

    // Animate the clicked element: move to center, scale up, fade out
    const rect = imgElement.getBoundingClientRect();
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const startX = rect.left + rect.width / 2;
    const startY = rect.top + rect.height / 2;
    const deltaX = centerX - startX;
    const deltaY = centerY - startY;
    imgElement.classList.add('enlarged');
    imgElement.style.left = `${rect.left}px`;
    imgElement.style.top = `${rect.top}px`;
    imgElement.style.width = `${rect.width}px`;
    imgElement.style.height = `${rect.height}px`;
    imgElement.style.transform = `translate(0,0) scale(1)`;
    imgElement.style.transition = 'transform 0.8s cubic-bezier(.4,2,.6,1), opacity 0.8s';
    setTimeout(() => {
    imgElement.style.transform = `translate(${deltaX}px,${deltaY}px) scale(2.5)`;
    imgElement.style.opacity = '0';
    }, 30);

    // Fade out the content area (but not the background)
    const contentArea = document.querySelector('.content-area');
    setTimeout(() => {
    contentArea.style.opacity = '0';
    }, 800);
		// Notify parent: transition is starting (re-show preloader)
		// and also pass along where we're going so parent can sync its URL
		if (window.parent && window.parent !== window) {
		    window.parent.postMessage({
		        type: 'chfxNavigating',
		        wordCode: charOrWordCode,
		        nextSentenceCode: nextSentenceCode
		    }, '*');
		}
    // After fadeout, re-render the new sentence in-place (no page reload = background stays intact)
    setTimeout(() => {
    // Update the URL without reloading the page
    const newUrl = `${window.location.pathname}?page=${nextSentenceCode}`;
    window.history.pushState({ page: nextSentenceCode }, '', newUrl);
    currentSentenceCode = nextSentenceCode;
    // Reset content area and re-run init
    const contentArea = document.querySelector('.content-area');
    contentArea.style.opacity = '0';
    init().then(() => {
        setTimeout(() => { contentArea.style.opacity = '1'; }, 100);
    });
    }, 1700);
    }

    // --- Audio playback logic ---
    function playAudio() {
    if (audioPlayer) {
    audioPlayer.currentTime = 0;
    audioPlayer.play();
    }
    }

    // --- Synth wave animation ---
    let waveAnimId = null;
    
    function setupSynthWaveAnimation() {
    const synthWave = document.getElementById('synth-wave');
    if (!synthWave) return;
    
    const bars = Array.from(synthWave.querySelectorAll('rect'));
    
    function animateWave() {
    bars.forEach((bar, i) => {
    const base = [14, 10, 6, 10][i];
    const amp = [4, 6, 10, 6][i];
    const t = Date.now() / 250 + i * 0.7;
    bar.setAttribute('y', base - Math.abs(Math.sin(t)) * amp);
    bar.setAttribute('height', 12 + Math.abs(Math.sin(t)) * amp * 2);
    });
    if (!audioPlayer.paused && !audioPlayer.ended) {
    waveAnimId = requestAnimationFrame(animateWave);
    }
    }
    
    audioPlayer.addEventListener('play', () => {
    if (waveAnimId) cancelAnimationFrame(waveAnimId);
    animateWave();
    });
    
    audioPlayer.addEventListener('pause', () => {
    if (waveAnimId) cancelAnimationFrame(waveAnimId);
    // Reset bars to default
    [14, 10, 6, 10].forEach((y, i) => {
    bars[i].setAttribute('y', y);
    bars[i].setAttribute('height', [12, 16, 24, 16][i]);
    });
    });
    
    audioPlayer.addEventListener('ended', () => {
    if (waveAnimId) cancelAnimationFrame(waveAnimId);
    [14, 10, 6, 10].forEach((y, i) => {
    bars[i].setAttribute('y', y);
    bars[i].setAttribute('height', [12, 16, 24, 16][i]);
    });
    });
    }

    // --- Init everything ---
    window.addEventListener('load', () => {
    init();
    
    // Play audio on click, except for character images
    document.body.addEventListener('click', function(e) {
    if (e.target.classList.contains('character-image') || 
    e.target.classList.contains('word-image') || 
    e.target.classList.contains('character-fallback')) return;
    playAudio();
    });
    
    // Setup synth wave animation after DOM is fully loaded
    setTimeout(setupSynthWaveAnimation, 500);
    });
    
    // Handle browser back/forward navigation without reloading the page
    window.addEventListener('popstate', () => {
    const contentArea = document.querySelector('.content-area');
    contentArea.style.opacity = '0';
    const urlParams = new URLSearchParams(window.location.search);
    currentSentenceCode = urlParams.get('page');
    init().then(() => {
        setTimeout(() => { contentArea.style.opacity = '1'; }, 100);
    });
    });

    window.addEventListener('resize', () => {
    calculateOptimalFontSize(); 
    init();
    });
    </script>
</body>
