<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .content {
            flex-grow: 1;
        }
        .section {
            height: 100vh;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .section img {
            max-height: 100%;
            max-width: 100%;
        }
        .youtube-video {
            height: 100vh;
            width: 100%;
        }
        .bottom-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100px;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .nav-item img {
            width: 80px;
            height: 80px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="content" class="content"></div>

    <div class="bottom-navigation">
        <div class="nav-item" id="prevPage">
            <img src="https://chfx.chineseffect.com/images/arrowLeft.png" alt="Previous Page">
        </div>
        <div class="nav-item" id="guidePage">
            <img src="https://chfx.chineseffect.com/images/guide.png" alt="Guide">
        </div>
        <div class="nav-item" id="nextPage">
            <img src="https://chfx.chineseffect.com/images/arrowRight.png" alt="Next Page">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        const csvFilePath = 'https://chfx.chineseffect.com/chfxWeb.csv';
        const imagesPath = 'https://chfx.chineseffect.com/images/';
        const audioPath = 'https://chineseffect.com/audio/random/';
        const pageName = new URLSearchParams(window.location.search).get('page');  // Extracts the current page name

        // Function to check if either .png or .webp exists for a visual file
        function findImageFile(baseName, callback) {
            const pngPath = `${imagesPath}${baseName}.png`;
            const webpPath = `${imagesPath}${baseName}.webp`;

            // Check if the .png file exists
            fetch(pngPath, { method: 'HEAD' }).then(response => {
                if (response.ok) {
                    callback(pngPath);  // If .png exists, use it
                } else {
                    // If .png doesn't exist, check for .webp
                    fetch(webpPath, { method: 'HEAD' }).then(response => {
                        if (response.ok) {
                            callback(webpPath);  // If .webp exists, use it
                        } else {
                            console.error(`No image found for ${baseName}`);
                        }
                    });
                }
            });
        }

        function createSection(content, isYoutube = false) {
            const section = document.createElement('div');
            section.classList.add('section');
            if (isYoutube) {
                const iframe = document.createElement('iframe');
                iframe.classList.add('youtube-video');
                iframe.src = `https://www.youtube.com/embed/${content}`;
                section.appendChild(iframe);
            } else {
                findImageFile(content, (imagePath) => {
                    const img = document.createElement('img');
                    img.src = imagePath;
                    img.onclick = function() {
                        const audio = new Audio(`${audioPath}${content}.mp3`);
                        audio.play();
                    };
                    section.appendChild(img);
                });
            }
            document.getElementById('content').appendChild(section);
        }

        function loadPageData(pageName) {
            Papa.parse(csvFilePath, {
                download: true,
                header: true,
                complete: function(results) {
                    const rows = results.data;
                    const pageData = rows.find(row => row.nameOfSite === pageName);
                    
                    if (pageData) {
                        // Set background image
                        findImageFile(pageData.backgroundImage, (bgImagePath) => {
                            document.body.style.backgroundImage = `url(${bgImagePath})`;
                        });

                        // Add content
                        let i = 1;
                        while (pageData[`content${i}`]) {
                            if (pageData[`content${i}`].includes('youtube')) {
                                const youtubeID = pageData[`content${i}`].split('v=')[1];
                                createSection(youtubeID, true);
                            } else {
                                createSection(pageData[`content${i}`]);
                            }
                            i++;
                        }

                        // Update navigation buttons
                        updateNavigation(rows, pageName);
                    } else {
                        document.body.innerHTML = '<h1>Page not found</h1>';
                    }
                }
            });
        }

        function updateNavigation(rows, currentPage) {
            const currentIndex = rows.findIndex(row => row.nameOfSite === currentPage);

            // Previous page
