<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chineseffect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000;
            color: #fff;
        }

        /* ── Background ── */
        #background-frame {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            border: none;
            z-index: 6;
        }

        /* ── Content layer ── */
        #content-layer {
            position: fixed;
            inset: 0;
            z-index: 7;
        }

        .section {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .section.visible { opacity: 1; }

        /* ── Text styles ── */
        .textBold, .textNormal {
            font-family: 'Inter', -apple-system, sans-serif;
            color: rgba(255,255,255,0.95);
        }
        .textBold {
            font-weight: 600;
            font-size: clamp(28pt, 5vw, 44pt);
            text-align: center;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90vw;
            line-height: 1.2;
            text-shadow: 0 2px 40px rgba(0,0,0,0.6);
        }
        .textNormal {
            font-weight: 400;
            font-size: clamp(16pt, 2.5vw, 25pt);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: min(80vw, 900px);
            line-height: 1.65;
            color: rgba(255,255,255,0.88);
            text-shadow: 0 2px 30px rgba(0,0,0,0.5);
        }
        .textBold a, .textNormal a {
            color: rgba(171,222,255,0.95) !important;
            text-decoration: underline;
            text-decoration-color: rgba(171,222,255,0.4);
        }

        /* ── Iframe content ── */
        iframe.content-iframe {
            height: 100vh;
            width: 100vw;
            border: none;
        }

        /* ── Images ── */
        .content-img {
            height: 100vh;
            object-fit: contain;
            max-width: 100vw;
            max-height: 100vh;
            opacity: 0.9;
            cursor: pointer;
        }

        /* ── Navigation bar ── */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 28px 24px;
            pointer-events: none;
        }

        .nav-btn {
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background 0.2s, border-color 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            color: rgba(255,255,255,0.8);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.35);
            transform: scale(1.08);
            color: #fff;
        }
        .nav-btn:active { transform: scale(0.94); }
        .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .nav-home {
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background 0.2s, border-color 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            color: rgba(255,255,255,0.8);
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }
        .nav-home:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.35);
            transform: scale(1.08);
            color: #fff;
        }
        .nav-home:active { transform: scale(0.94); }
        .nav-home svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ── Loader ── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: opacity 0.4s ease, visibility 0s 0.4s;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .loader-logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: -0.5px;
            color: rgba(255,255,255,0.7);
        }
        .loader-logo span { font-weight: 600; }
        .loader-dots { display: flex; gap: 6px; }
        .loader-dots i {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            animation: dot-pulse 1.4s ease-in-out infinite;
            font-style: normal;
        }
        .loader-dots i:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots i:nth-child(3) { animation-delay: 0.4s; }

        .loader-error {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,120,100,0.85);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }
        @keyframes dot-pulse {
            0%, 80%, 100% { background: rgba(255,255,255,0.2); transform: scale(0.9); }
            40%            { background: rgba(255,255,255,0.7); transform: scale(1.1); }
        }

        @media (max-width: 600px) {
            .nav-bar { padding: 0 18px 18px; }
            .nav-btn { width: 42px; height: 42px; }
            .nav-home { width: 42px; height: 42px; }
        }

        /* ── Stage Opening / Final Cards (rendered as normal sections) ── */
        .stage-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            max-width: min(88vw, 480px);
            width: 100%;
            text-align: center;
        }

        /* eyebrow label */
        .stage-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 10px;
        }

        .stage-title {
            font-size: clamp(22pt, 4.5vw, 34pt);
            font-weight: 600;
            letter-spacing: -0.5px;
            color: rgba(255,255,255,0.97);
            line-height: 1.15;
            margin-bottom: 28px;
        }
        .stage-divider {
            width: 48px;
            height: 1px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-bottom: 28px;
        }
        .stage-instructions {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 100%;
            text-align: left;
            margin-bottom: 32px;
        }
        .stage-instruction-row {
            display: flex;
            align-items: flex-start;
            gap: 13px;
        }
        .stage-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stage-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .stage-instruction-text {
            font-size: clamp(10pt, 1.6vw, 13pt);
            font-weight: 400;
            color: rgba(255,255,255,0.6);
            line-height: 1.55;
        }
        .stage-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 28px;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.95);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 100px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.01em;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            -webkit-tap-highlight-color: transparent;
        }
        .stage-cta:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.38);
            transform: translateY(-1px);
        }
        .stage-cta:active { transform: scale(0.96); }

        .stage-final-body {
            font-size: clamp(11pt, 1.7vw, 14pt);
            font-weight: 400;
            color: rgba(255,255,255,0.6);
            line-height: 1.65;
            text-align: center;
            margin-bottom: 32px;
        }
        .stage-final-body strong {
            color: rgba(255,255,255,0.92);
            font-weight: 600;
        }

        /* ── Progress Bar ── */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0; right: 0;
            z-index: 11;
            display: flex;
            align-items: stretch;
            gap: 3px;
            padding: 10px 16px 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #progress-bar.visible {
            opacity: 1;
            pointer-events: all;
        }
        .pb-segment {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.35s ease, opacity 0.35s ease, transform 0.15s ease;
            background: rgba(255, 255, 255, 0.20);
        }
        .pb-segment:hover {
            transform: scaleY(1.6);
        }
        .pb-segment.done {
            background: rgba(255, 255, 255, 0.70);
        }
        .pb-segment.current {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.30);
        }
        @media (max-width: 600px) {
            #progress-bar { padding: 8px 10px 4px; gap: 2px; }
            .pb-segment { height: 2px; }
        }

    </style>
</head>
<body>

    <div id="progress-bar"></div>

    <div id="loader">
        <div class="loader-inner">
            <div class="loader-logo">chines<span>effect</span></div>
            <div class="loader-dots"><i></i><i></i><i></i></div>
            <div class="loader-error" id="loader-error">
                Could not load content.<br>
                Try disabling your ad blocker for this page.
            </div>
        </div>
    </div>

    <iframe id="background-frame" src="https://chineseffect.com/chfx/chfxBackground.html"></iframe>

    <div id="content-layer"></div>

    <nav class="nav-bar">
        <button class="nav-btn" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="11,4 6,9 11,14"/>
            </svg>
        </button>

        <a class="nav-home" id="homeBtn" aria-label="Chineseffect home"
           href="https://chineseffect.com"
           onclick="event.preventDefault(); window.top.location.href='https://chineseffect.com';">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8.5L9 3l6 5.5"/>
                <path d="M5 7.5V15h3v-3.5h2V15h3V7.5"/>
            </svg>
        </a>

        <button class="nav-btn" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7,4 12,9 7,14"/>
            </svg>
        </button>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
    (() => {
        // ── CONFIG ──────────────────────────────────────────────────────────────
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRpf3VgZ7McmNVsXvD2jrN-II3d_Pq6C0VLN4qi-yT4oWoXSHQ0mFQd_QlcBIdt4J0U_5E6FllJF9QE/pub?gid=0&single=true&output=csv';
        const IMAGES    = 'https://chineseffect.com/images/';
        const AUDIO     = 'https://chineseffect.com/audio/random/';

        const params   = new URLSearchParams(window.location.search);
        const pageName = params.get('page') || params.get('chfxpage') || 'page1';

        let allRows         = [];
        let currentPageData = null;
        let currentIdx      = 0;

        const layer  = document.getElementById('content-layer');
        const loader = document.getElementById('loader');

        // Safety net: never spin longer than 10s
        let safetyTimer = setTimeout(hideLoader, 10000);
        function hideLoader() {
            clearTimeout(safetyTimer);
            loader.classList.add('hidden');
        }

        // ── CACHE ────────────────────────────────────────────────────────────────
        // Maps content string → { state: 'loading'|'ready', src: string|null }
        // We only cache readiness + src, never DOM nodes (avoids detached-element bugs).
        const cache = new Map();

        // Off-screen container for pre-rendered iframes only
        const offscreen = document.createElement('div');
        offscreen.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1280px;height:720px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1;';
        document.body.appendChild(offscreen);

        // ── SEQUENTIAL PRELOAD QUEUE ─────────────────────────────────────────────
        let preloadQueue  = [];
        let preloadActive = false;

        function enqueuePreload(content) {
            if (!content || !content.trim()) return;
            if (cache.has(content)) return;
            if (preloadQueue.includes(content)) return;
            preloadQueue.push(content);
            drainQueue();
        }

        function drainQueue() {
            if (preloadActive || preloadQueue.length === 0) return;
            preloadActive = true;
            const content = preloadQueue.shift();
            loadOne(content, () => {
                preloadActive = false;
                drainQueue();
            });
        }

        function loadOne(content, done) {
            if (cache.has(content)) { done(); return; }

            if (content.startsWith('textBold:') || content.startsWith('textNormal:') || content.includes('youtube')) {
                // No asset to preload — mark ready immediately
                cache.set(content, { state: 'ready', src: null });
                done();

            } else if (content.startsWith('presentation:')) {
                const url = content.split('presentation:')[1].trim();
                const f   = document.createElement('iframe');
                f.style.cssText = 'width:100%;height:100%;border:none;';
                const entry = { state: 'loading', src: url, el: f };
                cache.set(content, entry);
                let settled = false;
                const settle = () => {
                    if (settled) return;
                    settled = true;
                    entry.state = 'ready';
                    done();
                };
                f.onload  = settle;
                f.onerror = settle;
                setTimeout(settle, 10000);
                f.src = url;
                offscreen.appendChild(f);

            } else if (!content.match(/\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i) && !content.startsWith('http')) {
                // Unrecognised content type — nothing to preload
                cache.set(content, { state: 'ready', src: null });
                done();

            } else {
                // Image — preload into a throw-away Image() to warm the browser cache.
                // We store only the resolved src; buildSection always creates a fresh node.
                const imgSrc = IMAGES + content;
                const entry  = { state: 'loading', src: imgSrc };
                cache.set(content, entry);
                const probe = new Image();
                let settled = false;
                const settle = () => {
                    if (settled) return;
                    settled = true;
                    entry.state = 'ready';
                    done();
                };
                probe.onload  = settle;
                probe.onerror = settle;
                probe.src = imgSrc;
                if (probe.complete) settle();
            }
        }

        // Queue the next LOOKAHEAD items after the current one.
        const LOOKAHEAD = 3;
        function queueNextItem(pageData, idx) {
            let queued = 0;
            // Exhaust remaining items on this page first
            for (let i = idx + 1; queued < LOOKAHEAD; i++) {
                const next = pageData[`content${i + 1}`];
                if (!next || !next.trim()) break;
                enqueuePreload(next);
                queued++;
            }
            // Fill remaining lookahead budget from the next page
            if (queued < LOOKAHEAD) {
                const pi       = allRows.findIndex(r => r.nameOfSite === pageData.nameOfSite);
                const nextPage = allRows[(pi + 1) % allRows.length];
                for (let i = 0; queued < LOOKAHEAD && nextPage?.[`content${i + 1}`]; i++, queued++) {
                    enqueuePreload(nextPage[`content${i + 1}`]);
                }
            }
        }

        // ── PROGRESS BAR ─────────────────────────────────────────────────────────
        const pbEl = document.getElementById('progress-bar');
        let pbTotal = 0;   // total segments for current stage
        // virtual indices: 0 = opening card, 1..N = content items, N+1 = final card

        function countScreens(pageData) {
            let n = 1; // content1
            while (pageData[`content${n + 1}`] && pageData[`content${n + 1}`].trim()) n++;
            return 1 + n + 1; // opening + content + final
        }

        function buildProgressBar(total) {
            pbTotal = total;
            pbEl.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const seg = document.createElement('div');
                seg.className = 'pb-segment';
                seg.dataset.idx = i;
                seg.addEventListener('click', () => pbNavigateTo(i));
                pbEl.appendChild(seg);
            }
            pbEl.classList.add('visible');
        }

        function updateProgressBar(virtualIdx) {
            const segs = pbEl.querySelectorAll('.pb-segment');
            segs.forEach((s, i) => {
                s.classList.remove('done', 'current');
                if (i < virtualIdx)      s.classList.add('done');
                else if (i === virtualIdx) s.classList.add('current');
            });
        }

        // virtualIdx: 0=opening, 1..N=content0..contentN-1, last=final
        function pbNavigateTo(virtualIdx) {
            if (virtualIdx === 0) {
                // jump to opening card
                if (_cardMode !== 'opening') {
                    // re-show opening card without callback (just informational)
                    _cardMode = 'opening';
                    _openingCallback = () => { showContent(currentPageData, 0); };
                    showCardSection(buildOpeningCard(getStageNumber(currentPageData.nameOfSite)));
                    updateProgressBar(0);
                }
                return;
            }
            const lastIdx = pbTotal - 1;
            if (virtualIdx === lastIdx) {
                // jump to final card
                if (_cardMode !== 'final') {
                    if (_cardMode === 'opening') dismissCard(null);
                    showFinalScreen(getStageNumber(currentPageData.nameOfSite));
                    updateProgressBar(lastIdx);
                }
                return;
            }
            // Content item: virtualIdx 1 → contentIdx 0, etc.
            const contentIdx = virtualIdx - 1;
            if (_cardMode === 'opening' || _cardMode === 'final') dismissCard(null);
            currentIdx = contentIdx;
            showContent(currentPageData, currentIdx);
            updateProgressBar(virtualIdx);
        }


        function init() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allRows = results.data.filter(r => r.nameOfSite && r.nameOfSite.trim());

                    currentPageData = allRows.find(r => r.nameOfSite.trim() === pageName);
                    console.log('[INIT] pageName:', JSON.stringify(pageName));
                    console.log('[INIT] rows loaded:', allRows.length);
                    console.log('[INIT] match found:', !!currentPageData);

                    if (currentPageData) {
                        const stageNum = getStageNumber(currentPageData.nameOfSite);
                        if (stageNum !== null) {
                            buildProgressBar(countScreens(currentPageData));
                            updateProgressBar(0);
                            // Hide the loader right away — opening screen takes its place
                            hideLoader();
                            // Show opening screen immediately; load content only after dismiss
                            showOpeningScreen(stageNum, () => {
                                showContent(currentPageData, currentIdx);
                            });
                            // Preload content1 in background while user reads the opening screen
                            const c1 = currentPageData['content1'];
                            if (c1 && c1.trim()) enqueuePreload(c1);
                        } else {
                            showContent(currentPageData, currentIdx);
                        }
                    } else {
                        document.getElementById('loader-error').style.display = 'block';
                        document.querySelector('.loader-dots').style.display = 'none';
                    }
                },
                error: function(err) {
                    console.error('Sheet load failed:', err);
                    document.getElementById('loader-error').style.display = 'block';
                    document.querySelector('.loader-dots').style.display = 'none';
                }
            });
        }

        init();

        // ── BUILD SECTION ────────────────────────────────────────────────────────
        // Always creates a fresh DOM node. Uses the browser cache (warmed by preload)
        // for instant display — never reuses detached DOM elements.
        function buildSection(content, onReady) {
            const section = document.createElement('div');
            section.className = 'section';

            if (content.startsWith('presentation:')) {
                const entry = cache.get(content);
                let f;
                // Reuse the pre-rendered iframe from offscreen if available
                if (entry?.el instanceof HTMLIFrameElement && entry.state === 'ready') {
                    f = entry.el;
                    if (f.parentNode === offscreen) offscreen.removeChild(f);
                    f.style.cssText = '';
                    entry.el = null; // don't reuse again
                } else {
                    f = document.createElement('iframe');
                    f.src = content.split('presentation:')[1].trim();
                }
                f.className = 'content-iframe';
                section.appendChild(f);

                if (entry?.state === 'ready') {
                    setTimeout(onReady, 0);
                } else {
                    let settled = false;
                    const settle = () => { if (!settled) { settled = true; onReady(); } };
                    f.onload  = settle;
                    f.onerror = settle;
                    setTimeout(settle, 10000);
                }

            } else if (content.startsWith('textBold:')) {
                const div = document.createElement('div');
                div.className = 'textBold';
                div.innerHTML = content.slice('textBold:'.length);
                section.appendChild(div);
                setTimeout(onReady, 0);

            } else if (content.startsWith('textNormal:')) {
                const div = document.createElement('div');
                div.className = 'textNormal';
                div.innerHTML = content.slice('textNormal:'.length);
                section.appendChild(div);
                setTimeout(onReady, 0);

            } else if (content.includes('youtube')) {
                const f   = document.createElement('iframe');
                f.className = 'content-iframe';
                const vid = content.includes('shorts')
                    ? content.split('shorts/')[1]
                    : content.split('v=')[1];
                f.src = `https://www.youtube.com/embed/${vid}?autoplay=0`;
                f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                f.allowFullscreen = true;
                section.appendChild(f);
                setTimeout(onReady, 0);

            } else if (!content.match(/\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i) && !content.startsWith('http')) {
                // Unrecognised content type — show a placeholder message
                const div = document.createElement('div');
                div.className = 'textNormal';
                div.style.cssText = 'align-items:center;justify-content:center;text-align:center;color:rgba(255,255,255,0.45);font-style:italic;';
                div.textContent = 'A video will appear here once it\'s ready.';
                section.appendChild(div);
                setTimeout(onReady, 0);

            } else {
                // Image — always a fresh node; browser disk/memory cache does the work.
                const imgSrc = IMAGES + content;
                const img    = new Image();
                img.className = 'content-img';
                img.onclick = () => {
                    const a = new Audio(`${AUDIO}${content.split('.')[0]}.mp3`);
                    a.play().catch(() => {});
                };
                img.src = imgSrc;
                section.appendChild(img);

                let settled = false;
                const settle = () => { if (!settled) { settled = true; onReady(); } };
                // img.complete is true immediately when the browser has it cached
                if (img.complete && img.naturalWidth > 0) {
                    setTimeout(settle, 0);
                } else {
                    img.onload  = settle;
                    img.onerror = settle;
                }
            }

            return section;
        }

        // ── SHOW CONTENT ─────────────────────────────────────────────────────────
        let showContent = function(pageData, idx) {
            const content = pageData[`content${idx + 1}`];
            if (!content || !content.trim()) {
                if (idx === 0) {
                    console.error('[showContent] No content1 for page:', pageData.nameOfSite);
                    document.getElementById('loader-error').style.display = 'block';
                    document.querySelector('.loader-dots').style.display = 'none';
                    hideLoader();
                    return;
                }
                navigateToPage(1);
                return;
            }

            // Update progress bar: virtualIdx = idx + 1 (0 is opening card)
            updateProgressBar(idx + 1);

            // Kick off preload for upcoming items immediately (don't wait until after render)
            queueNextItem(pageData, idx);

            const oldSection = layer.querySelector('.section.visible');

            const newSection = buildSection(content, () => {
                requestAnimationFrame(() => {
                    newSection.classList.add('visible');
                    hideLoader();

                    if (oldSection) {
                        oldSection.classList.remove('visible');
                        setTimeout(() => {
                            if (oldSection.parentNode === layer) layer.removeChild(oldSection);
                        }, 350);
                    }
                });
            });

            layer.appendChild(newSection);
        }

        // ── NAVIGATION ──────────────────────────────────────────────────────────

        function getStageNumber(name) {
            const m = name && name.match(/(\d+)\s*$/);
            return m ? parseInt(m[1], 10) : null;
        }

        // State flags: are we currently showing an inline card?
        let _cardMode = null; // null | 'opening' | 'final'

        // Build and inject opening/final card as a normal .section into the content layer
        function buildOpeningCard(stageNum) {
            const isMobile = window.innerWidth <= 768;
            const mobileRows = isMobile ? `
                <div class="stage-instruction-row">
                    <span class="stage-icon"><svg viewBox="0 0 18 18"><rect x="1" y="3" width="16" height="11" rx="2"/><path d="M6 14l-.5 2M12 14l.5 2M5.5 16h7"/></svg></span>
                    <span class="stage-instruction-text">For a cinematic experience, use your computer or tablet.</span>
                </div>
                <div class="stage-instruction-row">
                    <span class="stage-icon"><svg viewBox="0 0 18 18"><rect x="5" y="1" width="8" height="16" rx="2"/><path d="M7 14.5h4"/></svg></span>
                    <span class="stage-instruction-text">Add to home screen for better access.</span>
                </div>` : '';
            const section = document.createElement('div');
            section.className = 'section';
            section.innerHTML = `
                <div class="stage-card">
                    <div class="stage-eyebrow">Your Journey</div>
                    <div class="stage-title">Welcome to Stage ${stageNum}</div>
                    <div class="stage-divider"></div>
                    <div class="stage-instructions">
                        ${mobileRows}
                        <div class="stage-instruction-row">
                            <span class="stage-icon"><svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="13" rx="2"/><path d="M2 7h14M6 1v4M12 1v4"/></svg></span>
                            <span class="stage-instruction-text">Ideally take several steps of the Journey every day.</span>
                        </div>
                        <div class="stage-instruction-row">
                            <span class="stage-icon"><svg viewBox="0 0 18 18"><path d="M3 14l2-1 9-9a1.4 1.4 0 0 0-2-2L3 12l-1 2z"/><path d="M12 4l2 2"/></svg></span>
                            <span class="stage-instruction-text">Make handwritten notes.</span>
                        </div>
                        <div class="stage-instruction-row">
                            <span class="stage-icon"><svg viewBox="0 0 18 18"><path d="M2 12c0-4.4 6-8 7-8s7 3.6 7 8"/><path d="M9 4v2M5 6l1.5 1.5M13 6l-1.5 1.5"/><ellipse cx="9" cy="13" rx="4" ry="3"/></svg></span>
                            <span class="stage-instruction-text">Practice active translating and speaking skills.</span>
                        </div>
                        <div class="stage-instruction-row">
                            <span class="stage-icon"><svg viewBox="0 0 18 18"><polyline points="3,9 7,13 15,5"/></svg></span>
                            <span class="stage-instruction-text">Have fun!</span>
                        </div>
                    </div>
                    <button class="stage-cta" id="opening-cta">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><polyline points="4,2 10,7 4,12"/></svg>
                        Let's go
                    </button>
                </div>`;
            section.querySelector('#opening-cta').addEventListener('click', () => {
                dismissCard(() => showContent(currentPageData, currentIdx));
            });
            return section;
        }

        function buildFinalCard(stageNum) {
            const section = document.createElement('div');
            section.className = 'section';
            section.innerHTML = `
                <div class="stage-card">
                    <div class="stage-eyebrow">Stage complete</div>
                    <div class="stage-title">Congratulations!</div>
                    <div class="stage-divider"></div>
                    <div class="stage-final-body">
                        You have just finished <strong>Stage ${stageNum}</strong>.<br><br>
                        See you in the next one whenever you are ready.<br><br>
                        Have fun!
                    </div>
                    <button class="stage-cta" id="final-cta">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><polyline points="4,2 10,7 4,12"/></svg>
                        Continue
                    </button>
                </div>`;
            section.querySelector('#final-cta').addEventListener('click', () => {
                dismissCard(() => navigateToPage(1));
            });
            return section;
        }

        function showCardSection(section) {
            const old = layer.querySelector('.section.visible');
            layer.appendChild(section);
            requestAnimationFrame(() => {
                section.classList.add('visible');
                if (old) {
                    old.classList.remove('visible');
                    setTimeout(() => { if (old.parentNode === layer) layer.removeChild(old); }, 350);
                }
            });
        }

        function dismissCard(then) {
            _cardMode = null;
            const card = layer.querySelector('.section.visible');
            if (card) {
                card.classList.remove('visible');
                setTimeout(() => { if (card.parentNode === layer) layer.removeChild(card); }, 350);
            }
            if (then) then();
            window.focus();
        }

        function showOpeningScreen(stageNum, onDismiss) {
            _cardMode = 'opening';
            // Store callback so arrow keys can also trigger it
            _openingCallback = onDismiss || null;
            hideLoader();
            showCardSection(buildOpeningCard(stageNum));
        }
        let _openingCallback = null;

        function showFinalScreen(stageNum) {
            _cardMode = 'final';
            updateProgressBar(pbTotal - 1);
            showCardSection(buildFinalCard(stageNum));
        }

        let navigateToPage = function(delta) {
            const cur  = allRows.findIndex(r => r.nameOfSite === (currentPageData?.nameOfSite || pageName));
            const next = allRows[(cur + delta + allRows.length) % allRows.length]?.nameOfSite;
            if (next) window.location.href = `?page=${next}`;
        }

        let goNext = function() {
            if (!currentPageData) return;

            // If an opening card is visible, dismiss it and start content
            if (_cardMode === 'opening') {
                const cb = _openingCallback;
                _openingCallback = null;
                dismissCard(cb);
                return;
            }
            // If a final card is visible, navigate forward
            if (_cardMode === 'final') {
                dismissCard(() => navigateToPage(1));
                return;
            }

            const hasMore = !!(currentPageData[`content${currentIdx + 2}`] && currentPageData[`content${currentIdx + 2}`].trim());
            if (!hasMore) {
                const stageNum = getStageNumber(currentPageData.nameOfSite);
                if (stageNum !== null) {
                    showFinalScreen(stageNum);
                    return;
                }
                navigateToPage(1);
                return;
            }
            currentIdx++;
            showContent(currentPageData, currentIdx);
        }

        let goPrev = function() {
            if (!currentPageData) return;

            // Opening card: left arrow dismisses and starts content (same as right)
            if (_cardMode === 'opening') {
                const cb = _openingCallback;
                _openingCallback = null;
                dismissCard(cb);
                return;
            }
            // Final card: left arrow just dismisses (stays on last content item)
            if (_cardMode === 'final') {
                dismissCard(null);
                return;
            }

            if (currentIdx > 0) {
                currentIdx--;
                showContent(currentPageData, currentIdx);
            } else {
                navigateToPage(-1);
            }
        }

        document.getElementById('nextBtn').onclick = goNext;
        document.getElementById('prevBtn').onclick = goPrev;

        // ── Keyboard navigation ──────────────────────────────────────────────────
        window.focus();
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
            if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); }
        });
        // Re-focus window when clicking content area so arrows keep working after iframe interaction
        document.getElementById('content-layer').addEventListener('click', () => {
            setTimeout(() => window.focus(), 100);
        });

        let tx = 0;
        document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchend',   e => {
            const dx = e.changedTouches[0].clientX - tx;
            if (Math.abs(dx) > 50) dx < 0 ? goNext() : goPrev();
        }, { passive: true });

    })();
    </script>
</body>
</html>
