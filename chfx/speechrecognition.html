<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Lato', sans-serif;
            background: linear-gradient(to bottom, #002840, #000000);
            color: #ABDEFF;
        }
        #sentence {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        #translation {
            font-size: 24px;
            text-align: center;
            margin-bottom: 40px;
        }
        #result {
            font-size: 24px;
            margin-top: 20px;
        }
        .chrome-disclaimer {
            margin-top: 20px;
            font-size: 14px;
            color: #FFB400;
        }
    </style>
</head>
<body>
    <div id="sentence"></div>
    <div id="translation"></div>
    <button id="startRecognition">Start Speaking</button>
    <div id="result"></div>
    <div class="chrome-disclaimer">Speech recognition works only in Chrome.</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const targetSentence = params.get('sentence');
        const translation = params.get('translation');

        document.getElementById('sentence').textContent = targetSentence;
        document.getElementById('translation').textContent = `Translation: ${translation}`;

        const resultDiv = document.getElementById('result');
        const startButton = document.getElementById('startRecognition');

        if (!('webkitSpeechRecognition' in window)) {
            resultDiv.textContent = "Speech recognition is not supported in this browser.";
        } else {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                resultDiv.textContent = spokenText === targetSentence ? "Correct!" : `Incorrect: You said "${spokenText}"`;
            };

            recognition.onerror = function() {
                resultDiv.textContent = "Error occurred. Please try again.";
            };

            startButton.onclick = () => {
                resultDiv.textContent = "Listening...";
                recognition.start();
            };
        }
    </script>
</body>
</html>
